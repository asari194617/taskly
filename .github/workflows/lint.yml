name: lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  select-runner:
    uses: ./.github/workflows/select-runner.yml

  biome:
    name: lint-biome
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.label) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint

  go-vet:
    name: lint-go-vet
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.label) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.10"
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: bash scripts/lint-go.sh

  ruff:
    name: lint-ruff
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.label) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: |
          python3 -m venv "$RUNNER_TEMP/taskly-lint-venv"
          "$RUNNER_TEMP/taskly-lint-venv/bin/pip" install -r requirements-lint.txt
          "$RUNNER_TEMP/taskly-lint-venv/bin/ruff" check .
