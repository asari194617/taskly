name: mcp-ci

on:
  push:
    branches:
      - "**"
    paths:
      - "apps/mcp/**"
      - ".github/workflows/mcp.yml"
  pull_request:
    paths:
      - "apps/mcp/**"

jobs:
  select-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.choose.outputs.runner || steps.fallback.outputs.runner }}
    steps:
      - id: choose
        if: github.event_name == 'pull_request' || secrets.RUNNER_FALLBACK_TOKEN == ''
        run: echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
      - id: fallback
        if: steps.choose.outcome == 'skipped'
        uses: jimmygchen/runner-fallback-action@v1
        with:
          github-token: ${{ secrets.RUNNER_FALLBACK_TOKEN }}
          primary-runner: self-hosted
          fallback-runner: ubuntu-latest

  build:
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: apps/mcp
        run: npm ci || npm install
      - name: Build
        working-directory: apps/mcp
        run: npm run build
