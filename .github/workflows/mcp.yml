name: mcp-ci

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  select-runner:
    uses: ./.github/workflows/select-runner.yml

  build:
    name: mcp-build
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.label) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/mcp/package-lock.json
      - name: Install
        working-directory: apps/mcp
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Build
        working-directory: apps/mcp
        run: npm run build
      - name: Test
        working-directory: apps/mcp
        run: npm test
