name: runner-diagnostics
# One-time pool preparation; removed before merge.
on:
  pull_request:
    paths: [".github/workflows/runner-diagnostics.yml"]
permissions:
  contents: read
jobs:
  prepare-pool:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/self-hosted-default-runner'
    runs-on: [self-hosted, taskly-ci]
    steps:
      - uses: actions/checkout@v7
      - name: Build CI-ready runner image
        run: docker build --tag taskly-actions-runner:2.337.0-ci infra/actions-runner
      - name: Verify runner tools
        run: |
          docker run --rm --entrypoint bash taskly-actions-runner:2.337.0-ci -ec 'python3 --version; python3 -m venv /tmp/check; docker compose version; test -d /ms-playwright'
      - name: Install slot launcher
        run: |
          # Target only the runner launcher, preserving registration and prod runner.
          docker run --rm -i --user root --entrypoint sh \
            --volume /opt/taskly-runner:/target \
            taskly-actions-runner:2.337.0-ci \
            -c 'cp /target/run-slot.sh /target/run-slot.sh.before-ci; cat > /target/run-slot.sh; chmod 0755 /target/run-slot.sh' < infra/actions-runner/run-slot.sh
          echo 'Launcher installed. Idle slots must be recycled before re-running CI.'
