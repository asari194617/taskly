name: runner-diagnostics
on:
  pull_request:
    paths: [".github/workflows/runner-diagnostics.yml"]
permissions: {}
jobs:
  reclaim-build-cache:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/self-hosted-default-runner'
    runs-on: [self-hosted, taskly-ci]
    steps:
      - name: Inspect runner disk
        run: |
          df -h
          docker system df
      - name: Reclaim unused build cache
        run: |
          docker builder prune --force --filter until=24h
          docker image prune --force --filter until=24h
          docker system df
          df -h
