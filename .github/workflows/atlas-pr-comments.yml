name: atlas-pr-comments

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  request:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      github.ref_protected &&
      github.run_attempt == '1' &&
      (startsWith(github.event.comment.body, 'atlas plan') ||
        startsWith(github.event.comment.body, 'atlas apply') ||
        startsWith(github.event.comment.body, '/atlas plan') ||
        startsWith(github.event.comment.body, '/atlas apply'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      respond: ${{ steps.request.outputs.respond }}
      command: ${{ steps.request.outputs.command }}
      plan_run: ${{ steps.request.outputs.plan_run }}
      artifact_id: ${{ steps.request.outputs.artifact_id }}
      revision_sha: ${{ steps.request.outputs.revision_sha }}
      base: ${{ steps.request.outputs.base }}
      artifact: ${{ steps.request.outputs.artifact }}
      message: ${{ steps.request.outputs.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: request
        name: Resolve command and pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const resolveRequest = require('./.github/scripts/atlas-pr-request.cjs');
            await resolveRequest(github, context, core);

  execute:
    needs: request
    if: needs.request.outputs.command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
    environment: atlas-${{ needs.request.outputs.command }}
    concurrency:
      group: infra-pr-comments-atlas
      cancel-in-progress: false
      queue: max
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      HEAD_SHA: ${{ needs.request.outputs.revision_sha }}
      BASE_SHA: ${{ needs.request.outputs.base }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      COMMENTER_LOGIN: ${{ github.event.comment.user.login }}
      COMMENTER_ID: ${{ github.event.comment.user.id }}
      ATLAS_COMMAND: ${{ needs.request.outputs.command }}
    outputs:
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
      changes: ${{ steps.atlas.outputs.changes }}
    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: workflow
      - name: Download the saved plan
        if: needs.request.outputs.command == 'apply'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ needs.request.outputs.plan_run }}
          github-token: ${{ github.token }}
          artifact-ids: ${{ needs.request.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/taskly-atlas-plan
      - name: Check out the PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.request.outputs.revision_sha }}
          persist-credentials: false
          path: proposal
      - id: atlas
        name: Run Atlas for the pinned PR schema
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_KEY: ${{ secrets.ATLAS_PLAN_KEY }}
          ATLAS_DB_HOST: ${{ vars.ATLAS_DB_HOST }}
          ATLAS_DB_PORT: ${{ vars.ATLAS_DB_PORT }}
          ATLAS_DB_NAME: ${{ vars.ATLAS_DB_NAME }}
          ATLAS_DB_USER: ${{ secrets.ATLAS_DB_USER }}
          ATLAS_DB_PASSWORD: ${{ secrets.ATLAS_DB_PASSWORD }}
          ATLAS_DB_CA: ${{ secrets.ATLAS_DB_CA }}
        run: bash workflow/.github/scripts/atlas-pr.sh "$ATLAS_COMMAND"
      - id: upload
        name: Save the plan result
        if: needs.request.outputs.command == 'plan'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ needs.request.outputs.artifact }}
          path: |
            ${{ runner.temp }}/taskly-atlas-plan/*.gpg
            ${{ runner.temp }}/taskly-atlas-plan/no-changes
          retention-days: 3
          if-no-files-found: error

  report:
    needs: [request, execute]
    if: always() && needs.request.outputs.respond == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Reply on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          COMMAND: ${{ needs.request.outputs.command }}
          PLAN_RUN: ${{ needs.request.outputs.plan_run }}
          HEAD_SHA: ${{ needs.request.outputs.revision_sha }}
          REQUEST_MESSAGE: ${{ needs.request.outputs.message }}
          EXECUTION_RESULT: ${{ needs.execute.result }}
          CHANGES: ${{ needs.execute.outputs.changes }}
          PLAN_ARTIFACT_URL: ${{ needs.execute.outputs.artifact_url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { COMMAND, PLAN_RUN, HEAD_SHA, REQUEST_MESSAGE, EXECUTION_RESULT, CHANGES, PLAN_ARTIFACT_URL } = process.env;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            let message = REQUEST_MESSAGE || 'The Atlas command could not be resolved.';
            if (COMMAND) {
              const revision = `\`${HEAD_SHA}\``;
              if (EXECUTION_RESULT !== 'success') {
                message = `Atlas ${COMMAND} finished with status **${EXECUTION_RESULT}** for ${revision}. See the workflow run for details.`;
              } else if (COMMAND === 'apply') {
                message = `Atlas applied the saved plan from run ${PLAN_RUN} for ${revision}.`;
              } else if (CHANGES === 'true') {
                message = [
                  `Atlas generated a plan with changes for ${revision}.`,
                  `Review the [encrypted plan](${PLAN_ARTIFACT_URL}), then post \`atlas apply\`.`,
                ].join('\n\n');
              } else {
                message = `Atlas found no changes for ${revision}.`;
              }
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.issue.number,
              body: `${message}\n\n[Workflow run](${runUrl})`,
            });
