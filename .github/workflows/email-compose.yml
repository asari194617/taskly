name: email-compose-ci

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  select-runner:
    uses: ./.github/workflows/select-runner.yml

  build:
    name: email-compose-build
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.label) }}
    defaults:
      run:
        working-directory: apps/email-compose
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/email-compose/package-lock.json
      - name: Install (fast)
        env:
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_AUDIT: "false"
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Typecheck & build
        run: npm run build
      - name: Install production dependencies only
        run: npm ci --omit=dev --no-audit --no-fund --ignore-scripts
      - name: Smoke test production runtime
        run: npm run smoke:prod
