name: email-compose-ci

on:
  push:
    branches:
      - "**"
    paths:
      - "apps/email-compose/**"
      - ".github/workflows/email-compose.yml"
  pull_request:
    paths:
      - "apps/email-compose/**"

jobs:
  select-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.pick.outputs.runner }}
    steps:
      - id: def
        run: echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
      - id: fbk
        name: Select self-hosted with fallback
        uses: dodi-smart/runner-fallback-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.RUNNER_FALLBACK_TOKEN || secrets.GITHUB_TOKEN }}
          primary-runner: self-hosted
          fallback-runner: ubuntu-latest
      - id: pick
        run: echo "runner=${{ steps.fbk.outputs.runner || steps.def.outputs.runner }}" >> "$GITHUB_OUTPUT"

  build:
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.label }}
    defaults:
      run:
        working-directory: apps/email-compose
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/email-compose/package-lock.json
      - name: Install (fast)
        env:
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_AUDIT: "false"
        run: npm ci --prefer-offline --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Typecheck & build
        run: npm run build

  docker:
    if: github.ref == 'refs/heads/main'
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.label }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/email-compose
          push: true
          provenance: false
          # GH-hostedは単一アーキ(amd64)で高速化。self-hostedはホストアーキに合わせる
          platforms: ${{ startsWith(needs.select-runner.outputs.label,'self-hosted') && (runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64') || 'linux/amd64' }}
          tags: ghcr.io/${{ github.repository }}/email-compose:latest
          cache-from: type=gha,scope=email-compose
          cache-to: type=gha,scope=email-compose,mode=max
