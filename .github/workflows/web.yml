name: web-ci

on:
  pull_request:

jobs:
  build-and-test:
    name: web-build-and-test
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Normalize runner workspace ownership
        working-directory: /
        run: |
          runner_uid="$(stat -c '%u' "$(dirname "$GITHUB_WORKSPACE")")"
          runner_gid="$(stat -c '%g' "$(dirname "$GITHUB_WORKSPACE")")"
          chown -R "$runner_uid:$runner_gid" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:canonical
      - run: npm run test:security-headers
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-browser-results
          path: apps/web/test-results/
          retention-days: 7
      - name: Restore runner workspace ownership
        if: always()
        working-directory: /
        run: |
          runner_uid="$(stat -c '%u' "$(dirname "$GITHUB_WORKSPACE")")"
          runner_gid="$(stat -c '%g' "$(dirname "$GITHUB_WORKSPACE")")"
          chown -R "$runner_uid:$runner_gid" "$GITHUB_WORKSPACE"
