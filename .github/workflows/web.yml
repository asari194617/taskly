name: web-ci

on:
  pull_request:

jobs:
  select-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.fbk.outputs.use-runner || '["ubuntu-latest"]' }}
    steps:
      - id: fbk
        name: Select self-hosted with fallback
        uses: dodi-smart/runner-fallback-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.RUNNER_FALLBACK_TOKEN || secrets.GITHUB_TOKEN }}
          primary-runner: self-hosted
          fallback-runner: ubuntu-latest

  build-and-test:
    name: web-build-and-test
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.label) }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:canonical
      - run: npm run test:security-headers
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-browser-results
          path: apps/web/test-results/
          retention-days: 7
