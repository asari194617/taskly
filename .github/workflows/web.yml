name: web-ci

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  select-runner:
    uses: ./.github/workflows/select-runner.yml

  build-and-test:
    name: web-build-and-test
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.label) }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Normalize runner workspace ownership
        working-directory: /
        run: |
          runner_uid="$(stat -c '%u' "$(dirname "$GITHUB_WORKSPACE")")"
          runner_gid="$(stat -c '%g' "$(dirname "$GITHUB_WORKSPACE")")"
          chown -R "$runner_uid:$runner_gid" "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:canonical
      - run: npm run test:security-headers
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-browser-results
          path: apps/web/test-results/
          retention-days: 7
      - name: Restore runner workspace ownership
        if: always()
        working-directory: /
        run: |
          runner_uid="$(stat -c '%u' "$(dirname "$GITHUB_WORKSPACE")")"
          runner_gid="$(stat -c '%g' "$(dirname "$GITHUB_WORKSPACE")")"
          chown -R "$runner_uid:$runner_gid" "$GITHUB_WORKSPACE"
