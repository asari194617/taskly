name: weekly-discord

on:
  schedule:
    # Monday 09:00 JST. Report covers the previous Monday through Sunday.
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: weekly-discord
  cancel-in-progress: false

jobs:
  select-runner:
    uses: ./.github/workflows/select-runner.yml

  report:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.label) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.3"
      - name: Send weekly activity to Discord
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEEKLY_DISCORD_WEBHOOK_URL: ${{ secrets.WEEKLY_DISCORD_WEBHOOK_URL }}
        run: node .github/scripts/weekly-discord.mjs
