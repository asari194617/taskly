name: compose-build-ci

on:
  pull_request:
    paths:
      - "apps/server/**"
      - "apps/email-compose/**"
      - "apps/mcp/**"
      - "infra/**"
      - ".github/workflows/compose-build.yml"

jobs:
  select-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.pick.outputs.runner }}
    steps:
      - id: def
        run: echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
      - id: fbk
        name: Select self-hosted with fallback
        uses: dodi-smart/runner-fallback-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.RUNNER_FALLBACK_TOKEN || secrets.GITHUB_TOKEN }}
          primary-runner: self-hosted
          fallback-runner: ubuntu-latest
      - id: pick
        run: echo "runner=${{ steps.fbk.outputs.runner || steps.def.outputs.runner }}" >> "$GITHUB_OUTPUT"

  build:
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.label }}
    steps:
      - uses: actions/checkout@v7
      - name: Build compose services
        working-directory: infra
        run: docker compose build --parallel
      - name: Verify Airflow batch binaries with runtime volumes
        working-directory: infra
        run: |
          touch ../.env
          docker compose run --rm --no-deps --entrypoint sh airflow-scheduler -ec '
            test -x /opt/airflow/bin/notifications-que-manager
            test -x /opt/airflow/bin/backup-mysql
            test -x /opt/airflow/bin/moderation
          '
