name: compose-build-ci

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  select-runner:
    uses: ./.github/workflows/select-runner.yml

  test-batches:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.label) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.10"
          cache: true
          cache-dependency-path: batches/go.sum
      - name: Test batches
        working-directory: batches
        run: go test ./...

  plan:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.label) }}
    outputs:
      count: ${{ steps.matrix.outputs.count }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Reject tracked compiled executables
        run: .github/scripts/check-no-compiled-binaries.sh
      - name: Test image path mapping
        run: .github/scripts/test-image-matrix.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
      - name: Test runner selection
        run: node --test .github/scripts/runner-selection.test.mjs
      - name: Test runner trust boundaries
        run: .github/scripts/test-runner-boundaries.sh
      - name: Test production environment deployment
        run: .github/scripts/test-prod-env-deploy.sh
      - name: Test interrupted production deployment guard
        run: bash infra/ops/test-deploy-state.sh
      - name: Test Airflow deploy recovery
        run: infra/ops/test-airflow-deploy-recovery.sh
      - name: Test disk maintenance safeguards
        run: infra/ops/test-disk-maintenance.sh
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env.example --file infra/docker-compose.yml config --quiet
      - name: Test Compose port exposure policy
        run: infra/ops/test-port-exposure.sh
      - name: Test Airflow database separation
        run: infra/ops/test-airflow-db-separation.sh
      - name: Test Datadog socket policy
        run: infra/ops/test-datadog-sockets.sh
      - name: Validate monitoring configuration and alert scenarios
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/infra/monitoring:/etc/prometheus:ro" prom/prometheus:v3.15.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/infra/monitoring:/etc/prometheus:ro" prom/prometheus:v3.15.1 test rules /etc/prometheus/alerts.test.yml
          docker run --rm --entrypoint /bin/amtool -v "$PWD/infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" prom/alertmanager:v0.34.1 check-config /etc/alertmanager/alertmanager.yml
          python3 -m py_compile infra/monitoring/airflow_exporter.py
      - name: Test Redis ACL policy
        run: infra/redis/test-acl.sh
      - id: matrix
        name: Select changed images
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t files < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          matrix=$(.github/scripts/image-matrix.sh -- "${files[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"
          echo "Changed files: ${files[*]}"
          echo "Image matrix: $matrix"
  build-images:
    needs: [select-runner, plan]
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.label) }}
    strategy:
      # Image builders share host disk with Go and browser jobs.
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: image=moby/buildkit:v0.26.2@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - name: Record build start
        run: echo "BUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          load: ${{ matrix.service == 'airflow' }}
          provenance: false
          tags: taskly-ci-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=pr-${{ matrix.cache_scope }}
          cache-to: type=gha,scope=pr-${{ matrix.cache_scope }},mode=min,ignore-error=true
      - name: Verify Airflow batch binaries
        if: matrix.service == 'airflow'
        run: |
          docker run --rm --entrypoint sh "taskly-ci-airflow:${{ github.sha }}" -ec '
            test -x /opt/airflow/bin/notifications-que-manager
            test -x /opt/airflow/bin/backup-mysql
            test -x /opt/airflow/bin/moderation
            mysqldump --version | grep -q "MySQL Community Server"
          '
      - name: Test Airflow Python DAGs
        if: matrix.service == 'airflow'
        run: |
          docker run --rm \
            --volume "$PWD/infra/airflow:/opt/airflow/ci:ro" \
            --entrypoint python \
            "taskly-ci-airflow:${{ github.sha }}" \
            -m unittest discover -s /opt/airflow/ci/tests -v
      - name: Remove CI-only Airflow image
        if: always() && matrix.service == 'airflow'
        env:
          CI_IMAGE: taskly-ci-airflow:${{ github.sha }}
        run: docker image rm "$CI_IMAGE" || true
      - name: Build timing
        if: always()
        run: |
          elapsed=$(($(date +%s) - BUILD_STARTED_AT))
          echo "### ${{ matrix.service }} image" >> "$GITHUB_STEP_SUMMARY"
          echo "Build and cache: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: compose-build
    needs: [select-runner, plan, build-images, test-batches]
    if: always() && needs.select-runner.result == 'success'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.label) }}
    steps:
      - name: Check image builds
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build-images.result }}
          BATCH_TEST_RESULT: ${{ needs.test-batches.result }}
          IMAGE_COUNT: ${{ needs.plan.outputs.count }}
        run: |
          echo "Selected image count: $IMAGE_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "Image build result: $BUILD_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$PLAN_RESULT" = success
          test "$BATCH_TEST_RESULT" = success
          if [[ "$IMAGE_COUNT" != 0 ]]; then
            test "$BUILD_RESULT" = success
          fi
