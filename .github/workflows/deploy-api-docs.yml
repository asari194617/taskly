name: Deploy API documentation

on:
  push:
    branches: [main]
    paths:
      - apps/docs/openapi/index.html
      - .github/workflows/deploy-api-docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskly-api-docs-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14.10"
      - run: python -m pip install awscli
      - name: Upload API documentation page
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp apps/docs/openapi/index.html "s3://${R2_BUCKET}/docs/api/index.html" \
            --endpoint-url "$endpoint" --content-type 'text/html; charset=utf-8' \
            --cache-control no-cache --no-progress
      - name: Verify public noindex metadata
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-delay 5 \
            'https://cdn.taskly.iy0306.com/docs/api/index.html' \
            | grep -F '<meta name="robots" content="noindex, nofollow" />'
