name: deploy-prod

on:
  push:
    branches: ["main"]
    paths:
      - "apps/server/**"
      - "atlas.hcl"
      - "apps/mcp/**"
      - "apps/email-compose/**"
      - "batches/**"
      - "infra/**"
      - ".github/scripts/check-prod-airflow.sh"
      - ".dockerignore"
      - ".github/scripts/image-matrix.sh"
      - ".github/scripts/require-prod-env.sh"
      - ".github/scripts/prepare-prod-env.py"
      - ".github/scripts/prepare-prod-ssh.sh"
      - ".github/scripts/run-prod-script.sh"
      - ".github/workflows/deploy-prod.yml"
  workflow_dispatch:
    inputs:
      full_build:
        description: Rebuild all production images
        type: boolean
        default: true
      runner_override:
        description: Runner for image build and release jobs
        type: choice
        options: [auto, primary, secondary, ubuntu-latest]
        default: auto

concurrency:
  group: deploy-production
  # Never terminate a job after it has begun changing the production host.
  cancel-in-progress: false

env:
  # The production host was verified as x86_64 on 2026-09-21.
  PRODUCTION_PLATFORM: linux/amd64

permissions:
  actions: read
  contents: read

jobs:
  select-runner:
    # Reject non-main manual dispatches before any image publication or host work.
    if: github.ref == 'refs/heads/main' && github.ref_protected
    uses: ./.github/workflows/select-runner.yml
    with:
      runner_override: ${{ inputs.runner_override || 'auto' }}

  plan:
    needs: select-runner
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.matrix.outputs.count }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      redis_acl_changed: ${{ steps.matrix.outputs.redis_acl_changed }}
      airflow_changed: ${{ steps.matrix.outputs.airflow_changed }}
      runner: ${{ needs.select-runner.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: matrix
        name: Select changed images
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FULL_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build }}
        run: |
          redis_acl_changed=false
          airflow_config_changed=false
          if [[ "$FULL_BUILD" == true ]]; then
            matrix=$(.github/scripts/image-matrix.sh --all)
            redis_acl_changed=true
          else
            base="$BEFORE_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="HEAD^"
            fi
            mapfile -t files < <(git diff --name-only "$base...HEAD")
            matrix=$(.github/scripts/image-matrix.sh -- "${files[@]}")
            for file in "${files[@]}"; do
              if [[ "$file" == infra/redis/entrypoint.sh ]]; then
                redis_acl_changed=true
              fi
              if [[ "$file" == infra/docker-compose.yml || "$file" == infra/docker-compose.prod.yml ]]; then
                airflow_config_changed=true
              fi
            done
            echo "Changed files: ${files[*]}"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"
          echo "redis_acl_changed=$redis_acl_changed" >> "$GITHUB_OUTPUT"
          airflow_changed=$(jq -r 'any(.include[]; .service == "airflow")' <<<"$matrix")
          if [[ "$airflow_config_changed" == true ]]; then airflow_changed=true; fi
          echo "airflow_changed=$airflow_changed" >> "$GITHUB_OUTPUT"
          echo "Image matrix: $matrix"

  publish-images:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    permissions:
      contents: read
      packages: write
    strategy:
      # The pool shares host disk with PR jobs.
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Restore workspace ownership
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace" alpine:3.20 chown -R "$(id -u):$(id -g)" /workspace
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Docker bridge DNS before publishing
        run: bash .github/scripts/check-build-registry-dns.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          # BuildKit 0.32 cannot unpack the Airflow base image on this host.
          # Keep an isolated builder per runner, pinned to the verified version.
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.26.2@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - name: Record build start
        run: echo "BUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false
          platforms: ${{ env.PRODUCTION_PLATFORM }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=min,ignore-error=true
      - name: Build timing
        if: always()
        run: |
          elapsed=$(($(date +%s) - BUILD_STARTED_AT))
          echo "### ${{ matrix.service }} image" >> "$GITHUB_STEP_SUMMARY"
          echo "Build, push, and cache: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

  release-images:
    needs: [plan, publish-images]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.ref_protected && needs.plan.result == 'success' && (needs.publish-images.result == 'success' || needs.publish-images.result == 'skipped') }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.26.2@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - name: Give every service the release SHA tag
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          CHANGED_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          for service in api email-compose mcp airflow; do
            source_tag=latest
            if jq -e --arg service "$service" '[.include[].service] | index($service) != null' <<<"$CHANGED_MATRIX" >/dev/null; then
              source_tag="$RELEASE_SHA"
            fi
            docker buildx imagetools create \
              --tag "ghcr.io/$REPOSITORY/$service:$RELEASE_SHA" \
              "ghcr.io/$REPOSITORY/$service:$source_tag"
          done
          for service in api email-compose mcp airflow; do
            docker buildx imagetools create \
              --tag "ghcr.io/$REPOSITORY/$service:latest" \
              "ghcr.io/$REPOSITORY/$service:$RELEASE_SHA"
          done
          echo "All production images are available at tag $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [plan, release-images]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.ref_protected && needs.plan.result == 'success' && needs.release-images.result == 'success' }}
    runs-on: [self-hosted, taskly-prod]
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_PASSPHRASE: ${{ secrets.PROD_SSH_PASSPHRASE }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      PROD_WORKDIR: ${{ secrets.PROD_WORKDIR }}
      PROD_ENV: ${{ secrets.PROD_ENV }}
      PROD_COMPOSE_PROFILES: ${{ secrets.PROD_COMPOSE_PROFILES }}
      GHCR_USERNAME: ${{ github.repository_owner }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_SHA: ${{ github.sha }}
      REDIS_ACL_CHANGED: ${{ needs.plan.outputs.redis_acl_changed }}
      AIRFLOW_CHANGED: ${{ needs.plan.outputs.airflow_changed }}
      PROD_PUBLIC_API_HEALTH_URL: ${{ secrets.PROD_PUBLIC_API_HEALTH_URL }}
      PROD_PUBLIC_MCP_HEALTH_URL: ${{ secrets.PROD_PUBLIC_MCP_HEALTH_URL }}
      PROD_PUBLIC_AIRFLOW_HEALTH_URL: ${{ secrets.PROD_PUBLIC_AIRFLOW_HEALTH_URL }}
    steps:
      - name: Restore workspace ownership
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace" alpine:3.20 chown -R "$(id -u):$(id -g)" /workspace
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Prepare dedicated production environment settings
        env:
          TASK_IMAGES_R2_ENDPOINT: ${{ secrets.TASK_IMAGES_R2_ENDPOINT }}
          TASK_IMAGES_R2_BUCKET: ${{ secrets.TASK_IMAGES_R2_BUCKET }}
          TASK_IMAGES_R2_ACCESS_KEY_ID: ${{ secrets.TASK_IMAGES_R2_ACCESS_KEY_ID }}
          TASK_IMAGES_R2_SECRET_ACCESS_KEY: ${{ secrets.TASK_IMAGES_R2_SECRET_ACCESS_KEY }}
          DEPLOY_NNCT_GUIDANCE_EVENT_ID: ${{ secrets.NNCT_GUIDANCE_EVENT_ID }}
          DEPLOY_NNCT_GUIDANCE_TASK_BINDINGS: ${{ secrets.NNCT_GUIDANCE_TASK_BINDINGS }}
          DEPLOY_NNCT_GUIDANCE_MCP_PARENT_RESOURCE: ${{ vars.NNCT_GUIDANCE_MCP_PARENT_RESOURCE }}
        run: python3 .github/scripts/prepare-prod-env.py
      - name: Require production environment
        run: .github/scripts/require-prod-env.sh
      - name: Record deploy start
        run: echo "DEPLOY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Prepare SSH (agent + askpass)
        timeout-minutes: 2
        run: .github/scripts/prepare-prod-ssh.sh
      - name: Verify SSH connectivity
        timeout-minutes: 2
        run: ssh -o BatchMode=yes -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" true
      - name: Verify unchanged schema against the committed production baseline
        timeout-minutes: 5
        id: schema_guard
        run: |
          set -eu
          rm -f "$RUNNER_TEMP/taskly-schema-baseline.json" "$RUNNER_TEMP/taskly-schema-proof.json"
          umask 077
          .github/scripts/run-prod-script.sh 120 schema-baseline "$PROD_WORKDIR" "$RELEASE_SHA" \
            < infra/ops/deploy-state.sh > "$RUNNER_TEMP/taskly-schema-baseline.json"
          python3 .github/scripts/verify-no-ddl-release.py \
            --target-sha "$RELEASE_SHA" \
            --baseline-file "$RUNNER_TEMP/taskly-schema-baseline.json" \
            --output "$RUNNER_TEMP/taskly-schema-proof.json" \
            --github-env "$GITHUB_ENV"
      - name: Save code-only schema attestation
        if: always() && steps.schema_guard.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: taskly-code-only-schema-${{ github.sha }}
          path: |
            ${{ runner.temp }}/taskly-schema-baseline.json
            ${{ runner.temp }}/taskly-schema-proof.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Check and mark production deployment
        timeout-minutes: 5
        run: |
          test "$SCHEMA_TARGET_SHA" = "$RELEASE_SHA"
          .github/scripts/run-prod-script.sh 120 begin "$PROD_WORKDIR" "$RELEASE_SHA" \
            "$SCHEMA_BASELINE_SHA" "$SCHEMA_DATABASE_DIGEST" < infra/ops/deploy-state.sh
      - name: Rsync repository to server
        timeout-minutes: 5
        run: |
          set -eux
          test -n "$PROD_WORKDIR"
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "/.env" \
            --exclude "/.deploy-state" \
            --exclude "/infra/.env" \
            --exclude ".DS_Store" \
            --exclude "**/node_modules" \
            --exclude "**/.next" \
            --exclude "**/.turbo" \
            --exclude "**/dist" \
            --exclude "**/build" \
            --exclude "**/.cache" \
            --exclude "**/.pnpm-store" \
            --exclude "**/coverage" \
            --exclude "**/*.log" \
            --exclude "**/*.tmp" \
            --exclude "**/*.swp" \
            --exclude "**/artifacts" \
            -e "ssh -p $PROD_SSH_PORT" ./ "$PROD_USER@$PROD_HOST:$PROD_WORKDIR/"
      - name: Install production environment
        timeout-minutes: 5
        run: |
          set -eu
          tmpenv=$(mktemp)
          trap 'rm -f "$tmpenv"' EXIT
          chmod 600 "$tmpenv"
          printf "%s" "$PROD_ENV" > "$tmpenv"
          printf -v quoted_workdir '%q' "$PROD_WORKDIR"
          remote_tmp=$(ssh -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" "mktemp $quoted_workdir/.env.upload.XXXXXXXX")
          printf -v quoted_tmp '%q' "$remote_tmp"
          trap 'rm -f "$tmpenv"; ssh -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" "rm -f $quoted_tmp"' EXIT
          scp -P "$PROD_SSH_PORT" "$tmpenv" "$PROD_USER@$PROD_HOST:$quoted_tmp"
          printf -v quoted_sha '%q' "$RELEASE_SHA"
          printf -v quoted_profiles '%q' "${PROD_COMPOSE_PROFILES:-}"
          ssh -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" \
            "bash $quoted_workdir/infra/ops/install-prod-env.sh $quoted_workdir $quoted_tmp $quoted_sha $quoted_profiles"
      - name: Remote deploy
        timeout-minutes: 30
        run: |
          set -eux
          set +x
          api_health_b64=$(printf '%s' "$PROD_PUBLIC_API_HEALTH_URL" | base64 | tr -d '\n')
          mcp_health_b64=$(printf '%s' "$PROD_PUBLIC_MCP_HEALTH_URL" | base64 | tr -d '\n')
          airflow_health_b64=$(printf '%s' "$PROD_PUBLIC_AIRFLOW_HEALTH_URL" | base64 | tr -d '\n')
          .github/scripts/run-prod-script.sh 1740 <<EOS
          set -euxo pipefail
          cd "$PROD_WORKDIR/infra"
          export COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
          export COMPOSE_PROFILES="${PROD_COMPOSE_PROFILES:-}"
          export TASKLY_IMAGE_TAG="$RELEASE_SHA"
          set +x
          export PROD_PUBLIC_API_HEALTH_URL=\$(printf '%s' '$api_health_b64' | base64 -d)
          export PROD_PUBLIC_MCP_HEALTH_URL=\$(printf '%s' '$mcp_health_b64' | base64 -d)
          export PROD_PUBLIC_AIRFLOW_HEALTH_URL=\$(printf '%s' '$airflow_health_b64' | base64 -d)
          set -x
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          ./ops/disk-maintenance.sh cleanup
          ./ops/disk-maintenance.sh pre-deploy
          test -S /var/run/datadog/apm.socket
          test -S /var/run/datadog/dsd.socket
          # The verified code-only path never invokes Atlas or starts a schema
          # dev database. Keep the existing database/Redis containers running even
          # when new application variables change their env_file contents.
          docker compose pull server email-compose mcp airflow-webserver airflow-scheduler airflow-dag-processor prometheus alertmanager blackbox grafana
          if [ "$REDIS_ACL_CHANGED" = true ]; then
            # The ACL is generated by Redis's entrypoint, so a bind-mount update
            # requires container recreation before the new policy takes effect.
            docker compose up -d --no-deps --no-build --force-recreate redis
          fi
          # A release SHA is assigned to all images, but unchanged Airflow
          # containers must keep running instead of being recreated for its tag.
          if ! docker compose up -d --no-deps --wait --wait-timeout 600 --no-build --remove-orphans server email-compose mcp prometheus alertmanager blackbox grafana; then
            docker compose ps
            docker compose logs --tail=50 --no-color db redis server email-compose mcp airflow-webserver airflow-scheduler airflow-dag-processor prometheus alertmanager blackbox grafana
            exit 1
          fi
          if [ "$AIRFLOW_CHANGED" = true ] || [ -z "\$(docker compose ps -q airflow-webserver)" ] || [ -z "\$(docker compose ps -q airflow-scheduler)" ] || [ -z "\$(docker compose ps -q airflow-dag-processor)" ]; then
            docker compose up -d --no-deps --wait --wait-timeout 600 --no-build airflow-webserver airflow-scheduler airflow-dag-processor
          fi
          # Retention enforcement must never remain paused after deployment.
          docker compose exec -T airflow-scheduler airflow dags unpause account_erasure </dev/null
          docker compose exec -T airflow-scheduler airflow dags details account_erasure -o plain </dev/null \
            | grep -Eq '^is_paused +False$'
          ./ops/verify-deploy-health.sh
          docker compose exec -T server curl --fail --silent --show-error --max-time 10 \
            --unix-socket /var/run/datadog/apm.socket http://localhost/info </dev/null >/dev/null
          docker compose exec -T email-compose node -e '
            const socket = require("node:net").connect("/var/run/datadog/apm.socket");
            const timeout = setTimeout(() => process.exit(1), 2000);
            socket.on("connect", () => { clearTimeout(timeout); socket.end(); });
            socket.on("close", () => process.exit(0));
            socket.on("error", () => process.exit(1));
          ' </dev/null
          # Do not let compose consume the remaining SSH heredoc from stdin.
          docker compose exec -T airflow-scheduler sh -ec '
            test -x /opt/airflow/bin/notifications-que-manager
            test -x /opt/airflow/bin/backup-mysql
            test -x /opt/airflow/bin/moderation
            mysqldump --version | grep -q "MySQL Community Server"
          ' </dev/null
          docker compose ps
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          ./ops/install-user-cron.sh "$PROD_WORKDIR"
          EOS
      - name: Mark production deployment complete
        timeout-minutes: 5
        run: |
          .github/scripts/run-prod-script.sh 120 complete "$PROD_WORKDIR" "$RELEASE_SHA" \
            "$SCHEMA_BASELINE_SHA" "$SCHEMA_DATABASE_DIGEST" < infra/ops/deploy-state.sh
      - name: Verify committed production release
        timeout-minutes: 5
        run: |
          set -euo pipefail
          umask 077
          .github/scripts/run-prod-script.sh 120 schema-baseline "$PROD_WORKDIR" "$RELEASE_SHA" \
            < infra/ops/deploy-state.sh > "$RUNNER_TEMP/taskly-completed-baseline.json"
          python3 .github/scripts/verify-no-ddl-release.py \
            --target-sha "$RELEASE_SHA" \
            --baseline-file "$RUNNER_TEMP/taskly-completed-baseline.json" \
            --committed-digest "$SCHEMA_DATABASE_DIGEST" \
            --output "$RUNNER_TEMP/taskly-completed-proof.json"
      - name: Check Airflow after deploy failure
        timeout-minutes: 5
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        run: .github/scripts/check-prod-airflow.sh
      - name: Deploy summary
        if: always()
        run: |
          elapsed=$(($(date +%s) - DEPLOY_STARTED_AT))
          echo "Deployed $RELEASE_SHA to $PROD_HOST:$PROD_WORKDIR in ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
