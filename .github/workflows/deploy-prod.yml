name: deploy-prod

on:
  push:
    branches: ["main"]
    paths:
      - "apps/server/**"
      - "apps/mcp/**"
      - "apps/email-compose/**"
      - "batches/**"
      - "infra/**"
      - ".github/workflows/deploy-prod.yml"
  workflow_dispatch: {}

jobs:
  select-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.pick.outputs.runner }}
    steps:
      - id: def
        run: echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
      - id: fbk
        name: Select self-hosted with fallback
        uses: dodi-smart/runner-fallback-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.RUNNER_FALLBACK_TOKEN || secrets.GITHUB_TOKEN }}
          primary-runner: self-hosted
          fallback-runner: ubuntu-latest
      - id: pick
        run: echo "runner=${{ steps.fbk.outputs.runner || steps.def.outputs.runner }}" >> "$GITHUB_OUTPUT"

  publish-images:
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.label }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./apps/server
            file: ./apps/server/Dockerfile
            cache_scope: api
          - service: email-compose
            context: ./apps/email-compose
            file: ./apps/email-compose/Dockerfile
            cache_scope: email-compose
          - service: mcp
            context: ./apps/mcp
            file: ./apps/mcp/Dockerfile
            cache_scope: mcp
          - service: airflow
            context: .
            file: ./infra/airflow/Dockerfile
            cache_scope: airflow
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false
          platforms: ${{ startsWith(needs.select-runner.outputs.label, 'self-hosted') && runner.arch == 'ARM64' && 'linux/arm64' || startsWith(needs.select-runner.outputs.label, 'self-hosted') && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max

  deploy:
    needs: [select-runner, publish-images]
    runs-on: ${{ needs.select-runner.outputs.label }}
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_PASSPHRASE: ${{ secrets.PROD_SSH_PASSPHRASE }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      PROD_WORKDIR: ${{ secrets.PROD_WORKDIR }}
      PROD_ENV: ${{ secrets.PROD_ENV }}
      PROD_COMPOSE_PROFILES: ${{ secrets.PROD_COMPOSE_PROFILES }}
      GHCR_USERNAME: ${{ github.repository_owner }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare SSH (agent + askpass)
        run: |
          set -eux
          install -m 700 -d ~/.ssh
          printf "%s" "$PROD_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$PROD_SSH_PORT" "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          eval "$(ssh-agent -s)"
          if [ -n "${PROD_SSH_PASSPHRASE:-}" ]; then
            : > /tmp/ssh_askpass.sh
            echo '#!/usr/bin/env sh' >> /tmp/ssh_askpass.sh
            echo 'echo "$PROD_SSH_PASSPHRASE"' >> /tmp/ssh_askpass.sh
            chmod +x /tmp/ssh_askpass.sh
            export SSH_ASKPASS=/tmp/ssh_askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
            setsid -w ssh-add ~/.ssh/id_rsa < /dev/null
          else
            ssh-add ~/.ssh/id_rsa
          fi
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Verify SSH connectivity
        run: |
          set -eux
          ssh -o BatchMode=yes -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" true

      - name: Rsync repository to server
        run: |
          set -eux
          test -n "$PROD_WORKDIR"
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".DS_Store" \
            --exclude "**/node_modules" \
            --exclude "**/.next" \
            --exclude "**/.turbo" \
            --exclude "**/dist" \
            --exclude "**/build" \
            --exclude "**/.cache" \
            --exclude "**/.pnpm-store" \
            --exclude "**/coverage" \
            --exclude "**/*.log" \
            --exclude "**/*.tmp" \
            --exclude "**/*.swp" \
            --exclude "**/artifacts" \
            -e "ssh -p $PROD_SSH_PORT" ./ "$PROD_USER@$PROD_HOST:$PROD_WORKDIR/"

      - name: Upload .env if provided
        if: env.PROD_ENV != ''
        run: |
          set -eu
          tmpenv=$(mktemp)
          printf "%s" "$PROD_ENV" > "$tmpenv"
          # Upload to project root
          scp -P "$PROD_SSH_PORT" "$tmpenv" "$PROD_USER@$PROD_HOST:$PROD_WORKDIR/.env"
          # Also upload a copy to infra/ for docker-compose context differences
          ssh -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" "mkdir -p '$PROD_WORKDIR/infra'"
          scp -P "$PROD_SSH_PORT" "$tmpenv" "$PROD_USER@$PROD_HOST:$PROD_WORKDIR/infra/.env"
          rm -f "$tmpenv"

      - name: Remote deploy
        run: |
          set -eux
          ssh -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" <<EOS
          set -euxo pipefail
          cd "$PROD_WORKDIR/infra"
          export COMPOSE_PROFILES="${PROD_COMPOSE_PROFILES:-}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          docker compose down --remove-orphans || true
          docker compose pull db redis server email-compose mcp airflow-webserver airflow-scheduler airflow-dag-processor
          docker compose up -d --no-build --remove-orphans db redis server email-compose mcp airflow-webserver airflow-scheduler airflow-dag-processor
          docker compose ps
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          EOS
        working-directory: infra

      - name: Summary
        run: |
          echo "Deployed to $PROD_HOST:$PROD_WORKDIR"
