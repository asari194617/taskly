name: deploy-prod

on:
  push:
    branches: ["main"]
    paths:
      - "apps/server/**"
      - "apps/mcp/**"
      - "apps/email-compose/**"
      - "batches/**"
      - "infra/**"
      - ".dockerignore"
      - ".github/scripts/image-matrix.sh"
      - ".github/workflows/deploy-prod.yml"
  workflow_dispatch:
    inputs:
      full_build:
        description: Rebuild all production images
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  # The production host was verified as x86_64 on 2026-09-21.
  PRODUCTION_PLATFORM: linux/amd64

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.matrix.outputs.count }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: matrix
        name: Select changed images
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FULL_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build }}
        run: |
          if [[ "$FULL_BUILD" == true ]]; then
            matrix=$(.github/scripts/image-matrix.sh --all)
          else
            base="$BEFORE_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="HEAD^"
            fi
            mapfile -t files < <(git diff --name-only "$base...HEAD")
            matrix=$(.github/scripts/image-matrix.sh -- "${files[@]}")
            echo "Changed files: ${files[*]}"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"
          echo "Image matrix: $matrix"
      - id: default-runner
        run: echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
      - id: fallback
        name: Select self-hosted with fallback
        uses: dodi-smart/runner-fallback-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.RUNNER_FALLBACK_TOKEN || secrets.GITHUB_TOKEN }}
          primary-runner: self-hosted
          fallback-runner: ubuntu-latest
      - id: pick
        run: echo "runner=${{ steps.fallback.outputs.runner || steps.default-runner.outputs.runner }}" >> "$GITHUB_OUTPUT"

  publish-images:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ needs.plan.outputs.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Record build start
        run: echo "BUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false
          platforms: ${{ env.PRODUCTION_PLATFORM }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=min,ignore-error=true
      - name: Build timing
        if: always()
        run: |
          elapsed=$(($(date +%s) - BUILD_STARTED_AT))
          echo "### ${{ matrix.service }} image" >> "$GITHUB_STEP_SUMMARY"
          echo "Build, push, and cache: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

  release-images:
    needs: [plan, publish-images]
    if: ${{ always() && needs.plan.result == 'success' && (needs.publish-images.result == 'success' || needs.publish-images.result == 'skipped') }}
    runs-on: ${{ needs.plan.outputs.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Give every service the release SHA tag
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          CHANGED_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          for service in api email-compose mcp airflow; do
            source_tag=latest
            if jq -e --arg service "$service" '[.include[].service] | index($service) != null' <<<"$CHANGED_MATRIX" >/dev/null; then
              source_tag="$RELEASE_SHA"
            fi
            docker buildx imagetools create \
              --tag "ghcr.io/$REPOSITORY/$service:$RELEASE_SHA" \
              "ghcr.io/$REPOSITORY/$service:$source_tag"
          done
          for service in api email-compose mcp airflow; do
            docker buildx imagetools create \
              --tag "ghcr.io/$REPOSITORY/$service:latest" \
              "ghcr.io/$REPOSITORY/$service:$RELEASE_SHA"
          done
          echo "All production images are available at tag $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [plan, release-images]
    runs-on: ${{ needs.plan.outputs.runner }}
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_PASSPHRASE: ${{ secrets.PROD_SSH_PASSPHRASE }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      PROD_WORKDIR: ${{ secrets.PROD_WORKDIR }}
      PROD_ENV: ${{ secrets.PROD_ENV }}
      PROD_COMPOSE_PROFILES: ${{ secrets.PROD_COMPOSE_PROFILES }}
      GHCR_USERNAME: ${{ github.repository_owner }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Record deploy start
        run: echo "DEPLOY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Prepare SSH (agent + askpass)
        run: |
          set -eux
          install -m 700 -d ~/.ssh
          printf "%s" "$PROD_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$PROD_SSH_PORT" "$PROD_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          eval "$(ssh-agent -s)"
          if [ -n "${PROD_SSH_PASSPHRASE:-}" ]; then
            : > /tmp/ssh_askpass.sh
            echo '#!/usr/bin/env sh' >> /tmp/ssh_askpass.sh
            echo 'echo "$PROD_SSH_PASSPHRASE"' >> /tmp/ssh_askpass.sh
            chmod +x /tmp/ssh_askpass.sh
            export SSH_ASKPASS=/tmp/ssh_askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
            setsid -w ssh-add ~/.ssh/id_rsa < /dev/null
          else
            ssh-add ~/.ssh/id_rsa
          fi
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Verify SSH connectivity
        run: ssh -o BatchMode=yes -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" true
      - name: Rsync repository to server
        run: |
          set -eux
          test -n "$PROD_WORKDIR"
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".DS_Store" \
            --exclude "**/node_modules" \
            --exclude "**/.next" \
            --exclude "**/.turbo" \
            --exclude "**/dist" \
            --exclude "**/build" \
            --exclude "**/.cache" \
            --exclude "**/.pnpm-store" \
            --exclude "**/coverage" \
            --exclude "**/*.log" \
            --exclude "**/*.tmp" \
            --exclude "**/*.swp" \
            --exclude "**/artifacts" \
            -e "ssh -p $PROD_SSH_PORT" ./ "$PROD_USER@$PROD_HOST:$PROD_WORKDIR/"
      - name: Upload .env if provided
        if: env.PROD_ENV != ''
        run: |
          set -eu
          tmpenv=$(mktemp)
          printf "%s" "$PROD_ENV" > "$tmpenv"
          scp -P "$PROD_SSH_PORT" "$tmpenv" "$PROD_USER@$PROD_HOST:$PROD_WORKDIR/.env"
          ssh -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" "mkdir -p '$PROD_WORKDIR/infra'"
          scp -P "$PROD_SSH_PORT" "$tmpenv" "$PROD_USER@$PROD_HOST:$PROD_WORKDIR/infra/.env"
          rm -f "$tmpenv"
      - name: Remote deploy
        run: |
          set -eux
          ssh -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" <<EOS
          set -euxo pipefail
          cd "$PROD_WORKDIR/infra"
          export COMPOSE_PROFILES="${PROD_COMPOSE_PROFILES:-}"
          export TASKLY_IMAGE_TAG="$RELEASE_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          docker compose down --remove-orphans || true
          docker compose pull db redis server email-compose mcp airflow-webserver airflow-scheduler airflow-dag-processor
          docker compose up -d --no-build --remove-orphans db redis server email-compose mcp airflow-webserver airflow-scheduler airflow-dag-processor
          docker compose exec -T airflow-scheduler sh -ec '
            test -x /opt/airflow/bin/notifications-que-manager
            test -x /opt/airflow/bin/backup-mysql
            test -x /opt/airflow/bin/moderation
          '
          docker compose ps
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          EOS
      - name: Deploy summary
        if: always()
        run: |
          elapsed=$(($(date +%s) - DEPLOY_STARTED_AT))
          echo "Deployed $RELEASE_SHA to $PROD_HOST:$PROD_WORKDIR in ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
