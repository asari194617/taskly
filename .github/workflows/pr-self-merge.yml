name: pr-self-merge
run-name: Self-merge request for PR #${{ github.event.issue.number }}

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  authorize:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      github.ref_protected &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.run_attempt == '1' &&
      (startsWith(github.event.comment.body, 'self-merge ') ||
        startsWith(github.event.comment.body, '/self-merge '))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: authorize
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { authorizeSelfMerge } = require('./.github/scripts/self-merge.cjs');
            const request = await authorizeSelfMerge(github, context);
            core.setOutput('allowed', Boolean(request));

  merge:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    environment: pr-self-merge
    concurrency:
      group: pr-self-merge-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SELF_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SELF_MERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - id: merge
        name: Merge the author's pinned PR revision
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { mergeOwnPR } = require('./.github/scripts/self-merge.cjs');
            const app = getOctokit(process.env.SELF_MERGE_TOKEN);
            const sha = await mergeOwnPR(github, app, context);
            core.setOutput('sha', sha);
        env:
          SELF_MERGE_TOKEN: ${{ steps.app.outputs.token }}
      - name: Reply to the merge request
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const summary = process.env.MERGE_SHA
              ? `Self-merged by the PR author at \`${process.env.MERGE_SHA}\`.`
              : 'GitHub did not confirm the self-merge. Check the PR status and workflow run.';
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.issue.number,
              body: `${summary}\n\n[Workflow run](${url})`,
            });
