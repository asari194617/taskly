name: production-nginx-maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect or upgrade the production Nginx package
        type: choice
        options: [inspect, upgrade]
        default: inspect

concurrency:
  group: production-nginx-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintain:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_HOST_KEY: ${{ secrets.PROD_SSH_HOST_KEY }}
      PROD_SSH_PASSPHRASE: ${{ secrets.PROD_SSH_PASSPHRASE }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      NGINX_ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare production SSH
        timeout-minutes: 2
        run: .github/scripts/prepare-prod-ssh.sh
      - name: Verify SSH connectivity
        timeout-minutes: 2
        run: ssh -o BatchMode=yes -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" true
      - name: ${{ inputs.action == 'upgrade' && 'Upgrade' || 'Inspect' }} production Nginx
        timeout-minutes: 7
        run: .github/scripts/run-prod-script.sh 360 "$NGINX_ACTION" < infra/ops/nginx-security-maintenance.sh
