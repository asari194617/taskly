name: pr-coverage

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('node:fs');
            const pr = context.payload.pull_request;
            fs.writeFileSync('pr.json', JSON.stringify({
              number: pr.number,
              sha: pr.head.sha,
              repository: pr.head.repo.full_name,
            }));
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-pr
          path: pr.json

  go:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: server
            directory: apps/server
            packages: ./internal/tasklist ./internal/handler/graphql
            include: ""
          - id: guidance-bridge
            directory: apps/server
            packages: ./internal/guidancebridge
            include: ""
            threshold: 80
          - id: batches
            directory: batches/notifications/delivery-channels/common
            packages: ./...
            include: ""
          - id: batch-email
            directory: batches/notifications/delivery-channels/email
            packages: ./...
            include: coverage_core\.go$
          - id: batch-web-push
            directory: batches/notifications/delivery-channels/web-push
            packages: ./...
            include: coverage_core\.go$
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.10"
          cache-dependency-path: ${{ matrix.directory }}/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.3"
      - name: Test with coverage
        working-directory: ${{ matrix.directory }}
        run: |
          go test -coverprofile=coverage.out ${{ matrix.packages }}
          node "$GITHUB_WORKSPACE/.github/scripts/coverage-summary.mjs" go-profile coverage.out "$GITHUB_WORKSPACE/${{ matrix.id }}.json" '${{ matrix.threshold || 75 }}' '${{ matrix.include }}'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.id }}
          path: ${{ matrix.id }}.json
          if-no-files-found: ignore

  web:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: node --test "$GITHUB_WORKSPACE/.github/scripts/coverage-summary.test.mjs"
      - run: npm ci
      - name: Test with coverage
        run: |
          npx vitest run --coverage --coverage.reporter=json-summary
          node "$GITHUB_WORKSPACE/.github/scripts/coverage-summary.mjs" istanbul coverage/coverage-summary.json "$GITHUB_WORKSPACE/web.json" 75
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-web
          path: web.json
          if-no-files-found: ignore

  mcp:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: apps/mcp/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Test with coverage
        run: |
          npx c8 --all --reporter=json-summary --include='dist-test/**/*.js' --include='dist/stdio.js' --exclude='**/__tests__/**' npm test
          node "$GITHUB_WORKSPACE/.github/scripts/coverage-summary.mjs" istanbul coverage/coverage-summary.json "$GITHUB_WORKSPACE/mcp.json" 75
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-mcp
          path: mcp.json
          if-no-files-found: ignore

  comment:
    needs: [go, web, mcp]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage-results
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.head.sha !== process.env.EXPECTED_SHA) {
              core.info('A newer PR revision exists; skipping this coverage comment.');
              return;
            }
            const marker = '<!-- taskly-pr-coverage -->';
            const rows = [
              ['API core (Go statements)', 'server'],
              ['Guidance bridge (Go statements, minimum 80%)', 'guidance-bridge'],
              ['Notification core (Go statements)', 'batches'],
              ['Email core (Go statements)', 'batch-email'],
              ['Web push core (Go statements)', 'batch-web-push'],
              ['Web logic (Vitest lines)', 'web'],
              ['MCP runtime (Node lines)', 'mcp'],
            ].map(([label, id]) => {
              let value = 'Unavailable (test or setup failed)';
              try {
                const result = JSON.parse(fs.readFileSync(`coverage-results/${id}.json`, 'utf8'));
                if (typeof result.percent === 'number' && Number.isFinite(result.percent) &&
                    result.percent >= 0 && result.percent <= 100) {
                  value = `${result.percent.toFixed(1)}%`;
                }
              } catch (error) {
                core.info(`${id}: ${error.message}`);
              }
              return `| ${label} | ${value} |`;
            });
            const body = [marker, '### Test coverage', '',
              '| Test group | Coverage |', '| --- | ---: |', ...rows, '',
              `Results for ${process.env.EXPECTED_SHA.slice(0, 7)}. The core scope in \`docs/testing/coverage.md\` has a 75% minimum. Go reports statement coverage; Web and MCP report line coverage.`,
              `[Workflow run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
