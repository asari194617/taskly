name: real-api-e2e

on:
  pull_request:
    paths:
      - "apps/server/**"
      - "atlas.hcl"
      - "infra/ops/apply-schema-ci.sh"
      - "apps/web/**"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/select-runner.yml"
      - "infra/actions-runner/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  select-runner:
    uses: ./.github/workflows/select-runner.yml

  web-api-db:
    # The browser server uses fixed ports on the self-hosted machine.
    concurrency: taskly-real-api-e2e
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.label) }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: taskly_e2e
          MYSQL_USER: taskly
          MYSQL_PASSWORD: taskly_e2e_password
        ports:
          - 127.0.0.1::3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      CI: "1"
      TASKLY_E2E_RESET: "1"
      MYSQL_USER: taskly
      MYSQL_PASSWORD: taskly_e2e_password
      MYSQL_DATABASE: taskly_e2e
      DB_HOST: 127.0.0.1
      REDIS_ADDR: 127.0.0.1:6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: taskly_e2e_password
      REDIS_CONTAINER: taskly-e2e-redis-${{ github.run_id }}-${{ github.run_attempt }}
      JWT_SECRET: taskly-e2e-isolated-secret-at-least-32-characters
      API_PORT: "3063"
      API_CORS_ORIGINS: http://localhost:4321
      NODE_ENV: development
      DD_TRACE_ENABLED: "false"
    steps:
      - name: Select isolated MySQL port
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: echo "DB_PORT=$MYSQL_PORT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: apps/server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start isolated Redis
        run: |
          docker rm -f "$REDIS_CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$REDIS_CONTAINER" -p 127.0.0.1::6379 redis:7-alpine redis-server --requirepass taskly_e2e_password
          redis_port="$(docker port "$REDIS_CONTAINER" 6379/tcp | sed 's/.*://')"
          test -n "$redis_port"
          echo "REDIS_ADDR=127.0.0.1:$redis_port" >> "$GITHUB_ENV"
      - name: Migrate and build API and reset helper
        run: |
          infra/ops/apply-schema-ci.sh
          (cd apps/server && go build -o server-e2e ./cmd/server)
          (cd apps/server && go build -o e2e-seed ./cmd/e2e-seed)
      - name: Start API
        working-directory: apps/server
        run: |
          ./server-e2e > "$RUNNER_TEMP/taskly-e2e-api.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3063/healthz; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/taskly-e2e-api.log"
          exit 1
      - name: Install browser dependencies
        working-directory: apps/web
        run: |
          npm ci
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Run real API browser tests
        working-directory: apps/web
        run: npm run test:e2e
      - name: Upload API log and browser evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: real-api-e2e-results
          path: |
            ${{ runner.temp }}/taskly-e2e-api.log
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
      - name: Stop isolated Redis
        if: always()
        run: docker rm -f "$REDIS_CONTAINER" >/dev/null 2>&1 || true
