name: reconcile-code-only-release

on:
  workflow_dispatch:

# Serialize with ordinary deployment. Never interrupt either operation.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  reconcile:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: [self-hosted, taskly-prod]
    environment: production
    timeout-minutes: 15
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_PASSPHRASE: ${{ secrets.PROD_SSH_PASSPHRASE }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      PROD_WORKDIR: ${{ secrets.PROD_WORKDIR }}
      PROD_PUBLIC_API_HEALTH_URL: ${{ secrets.PROD_PUBLIC_API_HEALTH_URL }}
      PROD_PUBLIC_MCP_HEALTH_URL: ${{ secrets.PROD_PUBLIC_MCP_HEALTH_URL }}
      PROD_PUBLIC_AIRFLOW_HEALTH_URL: ${{ secrets.PROD_PUBLIC_AIRFLOW_HEALTH_URL }}
      RELEASE_SHA: 85222d44a5bf082d36d9dd781889eda73f0ff013
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 85222d44a5bf082d36d9dd781889eda73f0ff013
          path: .reconcile-release
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact failed deployment and immutable schema attestation
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/verify-reconcile-attestation.py \
            --repo "$GITHUB_WORKSPACE/.reconcile-release" \
            --output-dir "$RUNNER_TEMP/taskly-reconcile-proof" \
            --github-env "$GITHUB_ENV"
      - name: Prepare bounded production SSH
        timeout-minutes: 2
        run: .github/scripts/prepare-prod-ssh.sh
      - name: Verify every remaining invariant and complete the exact release
        timeout-minutes: 8
        run: |
          set -euo pipefail
          test "$SCHEMA_TARGET_SHA" = "$RELEASE_SHA"
          {
            printf 'export PROD_PUBLIC_API_HEALTH_URL=%q\n' "$PROD_PUBLIC_API_HEALTH_URL"
            printf 'export PROD_PUBLIC_MCP_HEALTH_URL=%q\n' "$PROD_PUBLIC_MCP_HEALTH_URL"
            printf 'export PROD_PUBLIC_AIRFLOW_HEALTH_URL=%q\n' "$PROD_PUBLIC_AIRFLOW_HEALTH_URL"
            cat infra/ops/reconcile-code-only.sh
          } | .github/scripts/run-prod-script.sh 420 "$PROD_WORKDIR" "$RELEASE_SHA" "$SCHEMA_BASELINE_SHA" "$SCHEMA_DATABASE_DIGEST"
      - name: Verify committed production release
        timeout-minutes: 3
        run: |
          set -euo pipefail
          umask 077
          .github/scripts/run-prod-script.sh 120 schema-baseline "$PROD_WORKDIR" "$RELEASE_SHA" \
            < infra/ops/deploy-state.sh > "$RUNNER_TEMP/taskly-completed-baseline.json"
          python3 .github/scripts/verify-no-ddl-release.py \
            --repo "$GITHUB_WORKSPACE/.reconcile-release" \
            --target-sha "$RELEASE_SHA" \
            --baseline-file "$RUNNER_TEMP/taskly-completed-baseline.json" \
            --committed-digest "$SCHEMA_DATABASE_DIGEST" \
            --output "$RUNNER_TEMP/taskly-completed-proof.json"
