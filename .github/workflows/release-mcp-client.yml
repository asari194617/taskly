name: release-mcp-client

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-linux-win:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build stdio and package (linux/windows)
        run: |
          set -eux
          npm -C apps/mcp ci || npm -C apps/mcp install
          npm -C apps/mcp run build
          npm i -g pkg@5.8.1
          pkg --version
          mkdir -p artifacts
          test -f apps/mcp/dist/stdio.js
          PKG_PUBLIC="@modelcontextprotocol/sdk,undici"
          pkg apps/mcp/dist/stdio.js --targets node18-linux-x64   --public-packages "$PKG_PUBLIC" --output artifacts/taskly-mcp-linux-amd64
          pkg apps/mcp/dist/stdio.js --targets node18-linux-arm64 --public-packages "$PKG_PUBLIC" --output artifacts/taskly-mcp-linux-arm64
          pkg apps/mcp/dist/stdio.js --targets node18-win-x64     --public-packages "$PKG_PUBLIC" --output artifacts/taskly-mcp-windows-amd64.exe
          ls -la artifacts

      - name: Upload build artifacts (linux/windows)
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux-win
          path: artifacts/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build stdio and package (macos)
        run: |
          set -eux
          npm -C apps/mcp ci || npm -C apps/mcp install
          npm -C apps/mcp run build
          npm i -g pkg@5.8.1
          pkg --version
          mkdir -p artifacts
          test -f apps/mcp/dist/stdio.js
          PKG_PUBLIC="@modelcontextprotocol/sdk,undici"
          pkg apps/mcp/dist/stdio.js --targets node18-macos-x64   --public-packages "$PKG_PUBLIC" --output artifacts/taskly-mcp-darwin-amd64
          pkg apps/mcp/dist/stdio.js --targets node18-macos-arm64 --public-packages "$PKG_PUBLIC" --output artifacts/taskly-mcp-darwin-arm64
          ls -la artifacts

      - name: Upload build artifacts (macos)
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos
          path: artifacts/*

  publish:
    runs-on: ubuntu-latest
    needs: [build-linux-win, build-macos]
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -eux
          cd artifacts
          sha256sum * > checksums.txt

      - name: Prepare upload tree
        run: |
          set -eux
          TAG="${GITHUB_REF_NAME}"
          mkdir -p upload/docs/mcp/clients/${TAG}
          cp -v artifacts/* upload/docs/mcp/clients/${TAG}/
          cp -v apps/mcp-client-files/install.sh upload/docs/mcp/clients/
          cp -v apps/mcp-client-files/install.ps1 upload/docs/mcp/clients/
          cp -v apps/mcp-client-files/README.md upload/docs/mcp/clients/
          cp -v apps/mcp-client-files/LICENSE upload/docs/mcp/clients/
          echo "{\"tag\":\"${TAG}\"}" > upload/docs/mcp/clients/latest.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install AWS CLI
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install awscli

      - name: Upload to Cloudflare R2
        run: |
          set -eux
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp --recursive upload/docs/mcp/clients s3://${R2_BUCKET}/docs/mcp/clients --endpoint-url "$ENDPOINT" --no-progress

      - name: Summary
        run: |
          echo "Published ${GITHUB_REF_NAME} to R2 path docs/mcp/clients/${GITHUB_REF_NAME}/"
