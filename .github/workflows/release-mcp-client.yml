name: release-mcp-client

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  select-runner:
    # Native Windows/macOS builds cannot run on the Linux primary host.
    # Defer the entire release rather than publish an incomplete set of clients.
    if: vars.CI_PRIMARY_ONLY != 'true'
    uses: ./.github/workflows/select-runner.yml

  build-linux:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.label) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          cache: "npm"
          cache-dependency-path: apps/mcp/package-lock.json

      - name: Build stdio and package (linux)
        run: |
          set -eux
          npm -C apps/mcp ci --legacy-peer-deps --no-audit --no-fund
          npm -C apps/mcp run build
          npm i -g esbuild@0.25.10 @yao-pkg/pkg@6.22.0
          pkg --version
          mkdir -p artifacts
          mkdir -p .tmp/mcp-release
          esbuild apps/mcp/src/stdio.ts --bundle --platform=node --format=cjs --target=node22 --outfile=.tmp/mcp-release/taskly-mcp.cjs
          pkg .tmp/mcp-release/taskly-mcp.cjs --targets node22-linux-x64   --output artifacts/taskly-mcp-linux-amd64
          pkg .tmp/mcp-release/taskly-mcp.cjs --targets node22-linux-arm64 --output artifacts/taskly-mcp-linux-arm64
          case "$(uname -m)" in
            x86_64|amd64) node apps/mcp/tests/verify-binary.mjs "$(pwd)/artifacts/taskly-mcp-linux-amd64" ;;
            arm64|aarch64) node apps/mcp/tests/verify-binary.mjs "$(pwd)/artifacts/taskly-mcp-linux-arm64" ;;
          esac
          ls -la artifacts

      - name: Upload build artifacts (linux)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-linux
          path: artifacts/*

  build-windows:
    needs: select-runner
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          cache: "npm"
          cache-dependency-path: apps/mcp/package-lock.json

      # pkg bytecode is V8- and OS-specific. Building this executable on Linux
      # produces Linux bytecode that the embedded Windows V8 rejects at startup.
      - name: Build and verify stdio package (windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm -C apps/mcp ci --legacy-peer-deps --no-audit --no-fund
          npm -C apps/mcp run build
          npm install --global esbuild@0.25.10 @yao-pkg/pkg@6.22.0
          pkg --version
          New-Item -ItemType Directory -Force artifacts, .tmp/mcp-release | Out-Null
          esbuild apps/mcp/src/stdio.ts --bundle --platform=node --format=cjs --target=node22 --outfile=.tmp/mcp-release/taskly-mcp.cjs
          pkg .tmp/mcp-release/taskly-mcp.cjs --targets node22-win-x64 --output artifacts/taskly-mcp-windows-amd64.exe
          node apps/mcp/tests/verify-binary.mjs "$PWD/artifacts/taskly-mcp-windows-amd64.exe"
          Get-ChildItem artifacts

      - name: Upload build artifacts (windows)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-windows
          path: artifacts/*

  build-macos:
    needs: select-runner
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          cache: "npm"
          cache-dependency-path: apps/mcp/package-lock.json

      - name: Build stdio and package (macos)
        run: |
          set -eux
          npm -C apps/mcp ci --legacy-peer-deps --no-audit --no-fund
          npm -C apps/mcp run build
          npm i -g esbuild@0.25.10 @yao-pkg/pkg@6.22.0
          pkg --version
          mkdir -p artifacts
          mkdir -p .tmp/mcp-release
          esbuild apps/mcp/src/stdio.ts --bundle --platform=node --format=cjs --target=node22 --outfile=.tmp/mcp-release/taskly-mcp.cjs
          pkg .tmp/mcp-release/taskly-mcp.cjs --targets node22-macos-x64   --output artifacts/taskly-mcp-darwin-amd64
          pkg .tmp/mcp-release/taskly-mcp.cjs --targets node22-macos-arm64 --output artifacts/taskly-mcp-darwin-arm64
          case "$(uname -m)" in
            x86_64|amd64) node apps/mcp/tests/verify-binary.mjs "$(pwd)/artifacts/taskly-mcp-darwin-amd64" ;;
            arm64|aarch64) node apps/mcp/tests/verify-binary.mjs "$(pwd)/artifacts/taskly-mcp-darwin-arm64" ;;
          esac
          ls -la artifacts

      - name: Upload build artifacts (macos)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-macos
          path: artifacts/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [select-runner, build-linux, build-windows, build-macos]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.label) }}
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -eux
          cd artifacts
          sha256sum * > checksums.txt

      - name: Prepare upload tree
        run: |
          set -eux
          TAG="${GITHUB_REF_NAME}"
          mkdir -p upload/docs/mcp/clients/${TAG}
          cp -v artifacts/* upload/docs/mcp/clients/${TAG}/
          cp -v apps/mcp-client-files/install.sh upload/docs/mcp/clients/
          cp -v apps/mcp-client-files/install.ps1 upload/docs/mcp/clients/
          cp -v apps/mcp-client-files/README.md upload/docs/mcp/clients/
          cp -v apps/mcp-client-files/LICENSE upload/docs/mcp/clients/
          echo "{\"tag\":\"${TAG}\"}" > upload/docs/mcp/clients/latest.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: Install AWS CLI
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install awscli

      - name: Upload to Cloudflare R2
        run: |
          set -eux
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp --recursive upload/docs/mcp/clients s3://${R2_BUCKET}/docs/mcp/clients --endpoint-url "$ENDPOINT" --no-progress

      - name: Summary
        run: |
          echo "Published ${GITHUB_REF_NAME} to R2 path docs/mcp/clients/${GITHUB_REF_NAME}/"
