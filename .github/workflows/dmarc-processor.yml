name: dmarc-processor-ci

on:
  push:
    branches:
      - "**"
    paths:
      - "apps/dmarc-processor/**"
      - ".github/workflows/dmarc-processor.yml"
  pull_request:
    paths:
      - "apps/dmarc-processor/**"

jobs:
  select-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.pick.outputs.runner }}
    steps:
      - id: def
        run: echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
      - id: fbk
        name: Select self-hosted with fallback
        uses: jimmygchen/runner-fallback-action@v1
        continue-on-error: true
        with:
          github-token: ${{ secrets.RUNNER_FALLBACK_TOKEN || secrets.GITHUB_TOKEN }}
          primary-runner: self-hosted
          fallback-runner: ubuntu-latest
      - id: pick
        run: echo "runner=${{ steps.fbk.outputs.runner || steps.def.outputs.runner }}" >> "$GITHUB_OUTPUT"

  build:
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.label }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.4"
          cache: true
          cache-dependency-path: apps/dmarc-processor/go.sum
      - name: Build
        working-directory: apps/dmarc-processor
        run: |
          go mod download || true
          go build ./...

  docker:
    if: github.ref == 'refs/heads/main'
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.label }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/dmarc-processor
          push: true
          provenance: false
          platforms: ${{ startsWith(needs.select-runner.outputs.label,'self-hosted') && (runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64') || 'linux/amd64' }}
          tags: ghcr.io/${{ github.repository }}/dmarc-processor:latest
          cache-from: type=gha,scope=dmarc-processor
          cache-to: type=gha,scope=dmarc-processor,mode=max
