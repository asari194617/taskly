name: api-ci

on:
  pull_request:
    paths:
      - "apps/server/**"
      - ".github/workflows/api.yml"

jobs:
  select-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.pick.outputs.runner }}
    steps:
      - id: def
        run: echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
      - id: fbk
        name: Select self-hosted with fallback
        uses: dodi-smart/runner-fallback-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.RUNNER_FALLBACK_TOKEN || secrets.GITHUB_TOKEN }}
          primary-runner: self-hosted
          fallback-runner: ubuntu-latest
      - id: pick
        run: echo "runner=${{ steps.fbk.outputs.runner || steps.def.outputs.runner }}" >> "$GITHUB_OUTPUT"

  build:
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.label }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.4"
          cache: true
          cache-dependency-path: apps/server/go.sum
      - name: Build
        working-directory: apps/server
        run: |
          go mod download
          go build ./...
      - name: Test
        working-directory: apps/server
        run: go test ./...
