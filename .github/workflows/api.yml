name: api-ci

on:
  push:
    branches:
      - "**"
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"

jobs:
  select-runner:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.choose.outputs.runner || steps.fallback.outputs.runner }}
    steps:
      - id: choose
        if: github.event_name == 'pull_request' || secrets.RUNNER_FALLBACK_TOKEN == ''
        run: echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
      - id: fallback
        if: steps.choose.outcome == 'skipped'
        uses: jimmygchen/runner-fallback-action@v1
        with:
          github-token: ${{ secrets.RUNNER_FALLBACK_TOKEN }}
          primary-runner: self-hosted
          fallback-runner: ubuntu-latest

  build:
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/server/go.sum
      - name: Build
        working-directory: apps/server
        run: |
          go mod download
          go build ./...
      - name: Test
        working-directory: apps/server
        run: go test ./...
  docker:
    if: github.ref == 'refs/heads/main'
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.label }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}/api:latest
