openapi: 3.0.3
info:
  title: Taskly API
  version: 0.1.0
  description: Taskly REST API の初期草案です。
servers:
  - url: https://api.taskly.iy0306.com
    description: 本番環境
  - url: http://localhost:3063
    description: ローカル環境
tags:
  - name: auth
  - name: users
  - name: tasks
  - name: integrations
  - name: admin
  - name: ical
  - name: dayshift
  - name: calendar
paths:
  /healthz:
    get:
      summary: プロセスの生存確認
      tags: [auth]
      responses:
        "200":
          description: API プロセスが稼働しています。依存先は確認しません。
  /readyz:
    get:
      summary: API の準備状態を確認
      description: MySQL と Redis の応答を 2 秒の制限時間で確認します。
      tags: [auth]
      responses:
        "200":
          description: MySQL と Redis を利用できます
        "503":
          description: 必要な依存サービスを利用できません
  /auth/request-code:
    post:
      summary: ログインコードのメール送信を要求
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required: [email]
      responses:
        "202":
          description: コードを送信しました
  /auth/login:
    post:
      summary: パスワードでログインを開始、または多要素認証を完了
      description: |
        多要素認証が有効な場合、パスワードログインは 2 回のリクエストで行います。
        まず `email` と `password` を送ります。API は短時間だけ有効な不透明の `auth_transaction` を返します。
        2 回目はこの値と認証要素を 1 つだけ送ります。認証トランザクションと一緒にパスワードを再送しないでください。
        パスワードを設定していないアカウントは、引き続き `email` と認証要素 1 つを送信できます。
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                  writeOnly: true
                auth_transaction:
                  type: string
                  description: パスワード認証時に返された、1 回限り有効な不透明の多要素認証トランザクション
                code:
                  type: string
                totp:
                  type: string
                recovery_code:
                  type: string
              anyOf:
                - required: [email, password]
                - required: [auth_transaction]
                - required: [email]
      responses:
        "200":
          description: ログインしました
          content:
            application/json:
              schema:
                type: object
                required: [token, jwt]
                properties:
                  token: { type: string }
                  jwt: { type: string }
        "202":
          description: パスワードを確認しました。多要素認証が必要です。
          content:
            application/json:
              schema:
                type: object
                required: [mfa_required, auth_transaction, expires_in, methods]
                properties:
                  mfa_required: { type: boolean, enum: [true] }
                  auth_transaction: { type: string }
                  expires_in: { type: integer, example: 300 }
                  methods:
                    type: array
                    items: { type: string, enum: [email_code, totp, recovery] }
        "401":
          description: 認証情報もしくは多要素認証が無効、またはトランザクションが期限切れ・使用済みです
  /auth/logout:
    post:
      summary: 現在のセッションからログアウト
      tags: [auth]
      responses:
        "204":
          description: レスポンス本文なし
  /apikeys:
    get:
      summary: 現在のユーザーの API キー一覧を取得
      tags: [users]
      responses:
        "200": { description: 成功 }
    post:
      summary: 新しい API キーを作成（上限あり）
      tags: [users]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
      responses:
        "201": { description: 作成しました }
  /apikeys/{id}:
    patch:
      summary: API キーを無効化または更新
      tags: [users]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_valid: { type: boolean }
      responses:
        "200": { description: 更新しました }
  /users/me:
    get:
      summary: 現在のユーザーを取得
      tags: [users]
      responses:
        "200":
          description: ユーザーのプロフィール
  /2fa/totp/setup:
    post:
      summary: TOTP の設定を開始（シークレットと otpauth を返す）
      tags: [auth]
      responses:
        "200": { description: セットアップ情報 }
  /2fa/totp/activate:
    post:
      summary: コードの検証後に TOTP を有効化
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
              required: [code]
      responses:
        "204": { description: レスポンス本文なし }
  /2fa/totp/disable:
    post:
      summary: 現在のユーザーの TOTP を無効化
      tags: [auth]
      responses:
        "204": { description: レスポンス本文なし }
  /2fa/recovery/generate:
    post:
      summary: リカバリーコードを生成（既存の未使用コードを置き換える）
      tags: [auth]
      responses:
        "200": { description: 新しいコードを返しました }
  /tasks:
    get:
      summary: 課題一覧を取得（検索とカーソルページングに対応）
      tags: [tasks]
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: overdue
          schema: { type: boolean }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
        - in: query
          name: cursor_deadline
          schema: { type: string, format: date }
        - in: query
          name: cursor_id
          schema: { type: integer }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
                  next_cursor:
                    type: object
                    additionalProperties:
                      type: string
    post:
      summary: 課題を作成
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: 作成しました
  /tasks/{id}:
    get:
      summary: 課題を取得
      tags: [tasks]
      parameters:
        - in: path
          name: id
          schema: { type: integer }
          required: true
      responses:
        "200": { description: 成功 }
    patch:
      summary: 課題を更新
      tags: [tasks]
      parameters:
        - in: path
          name: id
          schema: { type: integer }
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "200": { description: 更新しました }
    delete:
      summary: 課題を削除（管理者・マネージャー）
      tags: [tasks]
      parameters:
        - in: path
          name: id
          schema: { type: integer }
          required: true
      responses:
        "204": { description: 削除しました }
  /integrations/teams/inbound:
    post:
      summary: Teams からの受信用 Webhook（Power Automate）
      tags: [integrations]
      parameters:
        - in: header
          name: X-Teams-Integration-Secret
          required: true
          schema: { type: string }
          description: Power Automate からの受信リクエストを認証する共有シークレット。
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                title: { type: string }
                description: { type: string }
                subject_id: { type: integer }
                deadline:
                  type: string
                  format: date
                  description: 省略時は受信日を使います。
                status_callback:
                  type: string
                  format: uri
                  description: HTTPS URL。オリジンが TEAMS_CALLBACK_ALLOWED_ORIGINS に登録されている必要があります。
              required: [email, title, subject_id]
      responses:
        "202": { description: ジョブをコミットしました。応答に job_id と status を含めます。 }
        "409": { description: 同じ冪等性キーが別のリクエストで使用済みです }
        "503": { description: DB を利用できないため、リクエストを受理しませんでした }
  /integrations/dayshift/inbound:
    post:
      summary: 日直に関するメールを検出したとき、日直を未達成にする受信用 Webhook
      tags: [integrations]
      parameters:
        - in: header
          name: X-Taskly-Secret
          required: true
          schema: { type: string }
          description: 日直の受信用の共有シークレット。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                content: { type: string }
                date:
                  {
                    type: string,
                    format: date,
                    description: 対象日を上書きします。既定値は今日です。,
                  }
      responses:
        "202": { description: 受理しました }
  /admin/permissions:
    get:
      summary: 権限の上書き設定をすべて取得
      tags: [admin]
      responses:
        "200": { description: 成功 }
    post:
      summary: 権限の上書き設定を作成
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: integer }
                target: { type: string }
                method: { type: string }
                value: { type: string, nullable: true }
              required: [user_id, target, method]
      responses:
        "201": { description: 作成しました }
  /admin/permissions/{id}:
    delete:
      summary: 権限の上書き設定を削除
      tags: [admin]
      parameters:
        - in: path
          name: id
          schema: { type: integer }
          required: true
      responses:
        "204": { description: 削除しました }
  /admin/users:
    get:
      summary: ロールとブロック状態を含むユーザー一覧を取得
      tags: [admin]
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
      responses:
        "200": { description: 成功 }
  /admin/users/{id}/roles:
    post:
      summary: ユーザーにロールを付与
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, manager] }
              required: [role]
      responses:
        "201": { description: 付与しました }
  /admin/users/{id}/roles/{role}:
    delete:
      summary: ユーザーのロールを取り消し
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: role
          required: true
          schema: { type: string, enum: [admin, manager] }
      responses:
        "204": { description: 取り消しました }
  /admin/users/{id}/block:
    post:
      summary: ユーザーをブロック（期限は任意）
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, nullable: true }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        "201": { description: ブロックしました }
  /admin/users/{id}/unblock:
    post:
      summary: ユーザーのブロックを解除
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: ブロックを解除しました }
  /integrations/teams/status:
    post:
      summary: Teams の処理状態を受け取るコールバック
      tags: [integrations]
      parameters:
        - in: header
          name: X-Signature
          required: false
          schema: { type: string }
          description: リクエスト本文の HMAC-SHA256 署名。形式は `sha256=<hex>` です。署名が有効な場合は必須です。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_success: { type: boolean }
                task_id: { type: integer }
                message_id: { type: string }
                conversation_id: { type: string }
      responses:
        "200": { description: 成功 }
  /admin/dayshift/assignments:
    get:
      summary: 最近の日直の割り当て一覧を取得
      tags: [admin, dayshift]
      responses:
        "200": { description: 成功 }
  /admin/dayshift/rotate:
    post:
      summary: 翌営業日に進め、ペアを割り当て
      tags: [admin, dayshift]
      responses:
        "204": { description: レスポンス本文なし }
  /admin/dayshift/{date}/status:
    post:
      summary: 指定日の割り当て状態を更新
      tags: [admin, dayshift]
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string, format: date }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  { type: string, enum: [assigned, completed, unfulfilled] }
                notes: { type: string, nullable: true }
              required: [status]
      responses:
        "204": { description: レスポンス本文なし }
  /admin/dayshift/{date}/shift:
    post:
      summary: 割り当てを翌営業日に移動
      tags: [admin, dayshift]
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        "204": { description: レスポンス本文なし }
  /admin/dayshift/cycles:
    get:
      summary: サイクル一覧を取得
      tags: [admin, dayshift]
      responses:
        "200": { description: 成功 }
    post:
      summary: サイクルを作成
      tags: [admin, dayshift]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                begin_date: { type: string, format: date }
                finish_date: { type: string, format: date }
                description: { type: string }
              required: [begin_date, finish_date, description]
      responses:
        "201": { description: 作成しました }
  /admin/dayshift/cycles/{id}:
    delete:
      summary: サイクルを削除
      tags: [admin, dayshift]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: レスポンス本文なし }
  /admin/dayshift/cycles/{id}/groups:
    get:
      summary: サイクルのグループ一覧を取得
      tags: [admin, dayshift]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: 成功 }
    post:
      summary: サイクルにグループを追加
      tags: [admin, dayshift]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_ids: { type: array, items: { type: integer } }
              required: [user_ids]
      responses:
        "201": { description: 作成しました }
  /admin/dayshift/cycles/{id}/groups/{groupId}:
    delete:
      summary: サイクルからグループを削除
      tags: [admin, dayshift]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: groupId
          required: true
          schema: { type: integer }
      responses:
        "204": { description: レスポンス本文なし }
  /admin/dayshift/cycles/{id}/groups/reorder:
    post:
      summary: サイクル内のグループを並べ替え
      tags: [admin, dayshift]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                group_ids: { type: array, items: { type: integer } }
              required: [group_ids]
      responses:
        "200": { description: 成功 }
  /admin/calendar/upsert-range:
    post:
      summary: 指定期間の営業日カレンダーを追加・更新
      tags: [admin, calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start: { type: string, format: date }
                end: { type: string, format: date }
                is_business_day: { type: boolean }
                notes: { type: string, nullable: true }
              required: [start, end, is_business_day]
      responses:
        "204": { description: レスポンス本文なし }
  /ical/{token}.ics:
    get:
      summary: ユーザーの iCal フィードを取得
      tags: [ical]
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: iCal データ
          content:
            text/calendar:
              schema:
                type: string
  /ical/tokens:
    get:
      summary: 現在のユーザーの iCal トークン一覧を取得
      tags: [ical]
      responses:
        "200": { description: 成功 }
    post:
      summary: 新しい iCal トークンを作成
      tags: [ical]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
      responses:
        "201": { description: 作成しました }
  /ical/tokens/{id}:
    delete:
      summary: iCal トークンを削除
      tags: [ical]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: 削除しました }
components:
  schemas:
    Task:
      type: object
      properties:
        id: { type: integer }
        added_user_id: { type: integer }
        title: { type: string }
        subject_id: { type: integer }
        description: { type: string, nullable: true }
        is_require_hand_in: { type: boolean }
        deadline: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskInput:
      type: object
      properties:
        title: { type: string }
        subject_id: { type: integer }
        description: { type: string }
        is_require_hand_in: { type: boolean }
        deadline: { type: string, format: date-time }
      required: [title, subject_id]
