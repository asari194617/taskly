x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Tokyo
    command:
      [
        "--sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION",
      ]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/usr/local/bin/taskly-redis-entrypoint"]
    env_file:
      - ../.env
    volumes:
      - redis-data:/data
      - ./redis/entrypoint.sh:/usr/local/bin/taskly-redis-entrypoint:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli --user "$${REDIS_USERNAME}" ping | grep -qx PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  server:
    image: ghcr.io/asari194617/taskly/api:${TASKLY_IMAGE_TAG:-latest}
    build: ../apps/server
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      email-compose:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3063:8080" # Host Nginx -> API
      - "127.0.0.1:3064:9464" # Host-only metrics scraping
    environment:
      # コンテナ間通信では localhost:3061 ではなく、サービス名:ポート を利用する
      REDIS_ADDR: redis:6379
      EMAIL_COMPOSE_GRPC_ADDR: email-compose:50051
      TZ: Asia/Tokyo
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  mcp:
    image: ghcr.io/asari194617/taskly/mcp:${TASKLY_IMAGE_TAG:-latest}
    build: ../apps/mcp
    container_name: taskly-mcp
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    environment:
      TASKLY_API_BASE_URL: http://server:8080
    networks:
      - default
      - proxy
    ports:
      - "127.0.0.1:3066:3066" # Host Nginx -> MCP
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3066/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  airflow-webserver:
    image: ghcr.io/asari194617/taskly/airflow:${TASKLY_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/airflow/Dockerfile
    container_name: taskly-airflow-web
    env_file:
      - ../.env
    depends_on:
      - db
    restart: unless-stopped
    logging: *default-logging
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__PARALLELISM: "8"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"
      AIRFLOW__SCHEDULER__MAX_THREADS: "2"
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "2"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__API__EXPOSE_CONFIG: "True"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+mysqlconnector://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: "8"
      AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: "0"
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING: "True"
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE: "1800"
      AIRFLOW__API__HOST: 0.0.0.0
      AIRFLOW__API__BASE_URL: http://localhost:3065
      AIRFLOW__WEBSERVER__BASE_URL: http://localhost:3065
      AIRFLOW__API__ENABLE_PROXY_FIX: "True"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-taskly-dev-jwt-secret-change-me}
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      # MySQL connection for DAGs
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # Datadog APM and Sentry config (enable via env file or override here)
      DD_SERVICE: taskly-airflow
      DD_TRACE_AGENT_PORT: "8126"
      DD_AGENT_HOST: ${DD_AGENT_HOST:-host.docker.internal}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      WEB_URL: http://localhost:3063
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:3065:3065" # Host Nginx -> Airflow
    volumes:
      - airflow-logs:/opt/airflow/logs
      - ./airflow/dags:/opt/airflow/dags
      - ../.env:/opt/airflow/.env:ro
      - ..:/workspace
    # Clean stale PID, initialize/upgrade DB once, then start webserver
    command:
      [
        "bash",
        "-lc",
        "rm -f /opt/airflow/airflow-webserver.pid; airflow db migrate; exec airflow api-server -p 3065",
      ]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:3065/api/v2/monitor/health"]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 90s
  email-compose:
    image: ghcr.io/asari194617/taskly/email-compose:${TASKLY_IMAGE_TAG:-latest}
    build: ../apps/email-compose
    container_name: taskly-email-compose
    env_file:
      - ../.env
    depends_on:
      - redis
    restart: unless-stopped
    logging: *default-logging
    environment:
      EMAIL_COMPOSE_GRPC_HOST: 0.0.0.0
      EMAIL_COMPOSE_GRPC_PORT: 50051
      DD_SERVICE: taskly-email-compose
      DD_TRACE_AGENT_PORT: "8126"
      DD_AGENT_HOST: ${DD_AGENT_HOST:-host.docker.internal}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').connect(50051,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  airflow-scheduler:
    image: ghcr.io/asari194617/taskly/airflow:${TASKLY_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/airflow/Dockerfile
    container_name: taskly-airflow-scheduler
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_started
      airflow-webserver:
        condition: service_started
      email-compose:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__PARALLELISM: "8"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"
      AIRFLOW__SCHEDULER__MAX_THREADS: "2"
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "2"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__API__BASE_URL: http://airflow-webserver:3065
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+mysqlconnector://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: "8"
      AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: "0"
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING: "True"
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE: "1800"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
      # MySQL connection for DAGs
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      EMAIL_COMPOSE_GRPC_ADDR: email-compose:50051
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # Datadog APM and Sentry config (enable via env file or override here)
      DD_SERVICE: taskly-airflow
      DD_TRACE_AGENT_PORT: "8126"
      DD_AGENT_HOST: ${DD_AGENT_HOST:-host.docker.internal}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      WEB_URL: http://localhost:3063
    volumes:
      - airflow-logs:/opt/airflow/logs
      - airflow-backups:/opt/airflow/backups
      - ./airflow/dags:/opt/airflow/dags
      - ../.env:/opt/airflow/.env:ro
      - ..:/workspace
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -x /opt/airflow/bin/notifications-que-manager && test -x /opt/airflow/bin/backup-mysql && test -x /opt/airflow/bin/moderation && airflow jobs check --job-type SchedulerJob --local",
        ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    # Clean stale PID, initialize/upgrade DB once, then start scheduler
    command:
      [
        "bash",
        "-lc",
        "rm -f /opt/airflow/airflow-scheduler.pid; airflow db migrate; exec airflow scheduler",
      ]
  airflow-dag-processor:
    image: ghcr.io/asari194617/taskly/airflow:${TASKLY_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/airflow/Dockerfile
    container_name: taskly-airflow-dag-processor
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_started
      airflow-webserver:
        condition: service_started
      email-compose:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    environment:
      AIRFLOW__CORE__PARALLELISM: "8"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"
      AIRFLOW__SCHEDULER__MAX_THREADS: "2"
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "2"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__API__BASE_URL: http://airflow-webserver:3065
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+mysqlconnector://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: "2"
      AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: "0"
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING: "True"
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE: "1800"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-taskly-dev-jwt-secret-change-me}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      EMAIL_COMPOSE_GRPC_ADDR: email-compose:50051
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Tokyo
    volumes:
      - airflow-logs:/opt/airflow/logs
      - ./airflow/dags:/opt/airflow/dags
      - ../.env:/opt/airflow/.env:ro
      - ..:/workspace
    command: ["bash", "-lc", "exec airflow dag-processor"]
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "DagProcessorJob", "--local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
volumes:
  db-data:
  redis-data:
  airflow-logs:
  airflow-backups:

networks:
  proxy:
    driver: bridge
