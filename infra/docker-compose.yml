services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskly
      MYSQL_USER: taskly
      MYSQL_PASSWORD: taskly_password
    ports:
      - "3060:3306" # MySQL
    command:
      [
        "--sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION",
      ]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "3061:6379" # Redis
    volumes:
      - redis-data:/data
  postfix:
    build: ./docker/postfix
    container_name: taskly-postfix
    ports:
      - "3062:25" # SMTP
    environment:
      - MYNETWORKS=0.0.0.0/0
      - RELAY_NETWORKS=:0.0.0.0/0
  # prometheus removed per infra cleanup
  server:
    build: ../apps/server
    env_file:
      - ../.env
    # Note: .env values like DB_HOST/PORT are overridden below for in-cluster access
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3063:8080" # API
      - "3064:9464" # Metrics
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: taskly
      DB_PASSWORD: taskly_password
      DB_NAME: taskly
      REDIS_ADDR: redis:6379
      METRICS_BIND_ADDR: 0.0.0.0:9464
  # web and mcp can be added later
  airflow-webserver:
    build: ./airflow
    container_name: taskly-airflow-web
    depends_on:
      - db
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - AIRFLOW__CORE__FERNET_KEY=please_change_me
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=taskly
      - DB_PASSWORD=taskly_password
      - DB_NAME=taskly
      - SMTP_HOST=postfix
      - SMTP_PORT=25
      - SMTP_FROM=noreply@taskly.local
      - WEB_URL=http://localhost:3063
    ports:
      - "3065:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ..:/workspace
    command: bash -lc "airflow db init && airflow users create --username admin --password admin --firstname A --lastname D --role Admin --email admin@example.com || true && airflow webserver"

  airflow-scheduler:
    build: ./airflow
    container_name: taskly-airflow-sch
    depends_on:
      - airflow-webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=taskly
      - DB_PASSWORD=taskly_password
      - DB_NAME=taskly
      - SMTP_HOST=postfix
      - SMTP_PORT=25
      - SMTP_FROM=noreply@taskly.local
      - WEB_URL=http://localhost:3063
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ..:/workspace
    command: bash -lc "airflow scheduler"

  airflow-triggerer:
    build: ./airflow
    container_name: taskly-airflow-trg
    depends_on:
      - airflow-webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ..:/workspace
    command: bash -lc "airflow triggerer"
volumes:
  db-data:
  redis-data:
