services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ../.env
    environment: # DB接続情報は、コンテナ内でのポートとコンテナ外のポートが異なるため、共通化せずに指定
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskly}
      MYSQL_USER: ${MYSQL_USER:-taskly}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-taskly_password}
    ports:
      - "3060:3306" # MySQL
    command:
      [
        "--sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION",
      ]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "3061:6379" # Redis
    volumes:
      - redis-data:/data
  postfix:
    build: ./docker/postfix
    container_name: taskly-postfix
    restart: unless-stopped
    ports:
      - "3062:25" # SMTP
    environment:
      - MYNETWORKS=0.0.0.0/0
      - RELAY_NETWORKS=:0.0.0.0/0
  server:
    build: ../apps/server
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    ports:
      - "3063:8080" # API
      - "3064:9464" # Metrics
    environment: {}
  # web and mcp can be added later
  mcp:
    build: ../apps/mcp
    container_name: taskly-mcp
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment: {}
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.taskly-mcp.rule=Host(`${MCP_DOMAIN}`)"
      - "traefik.http.routers.taskly-mcp.entrypoints=websecure"
      - "traefik.http.routers.taskly-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.taskly-mcp.loadbalancer.server.port=3066"
      # optional basic rate limiting
      - "traefik.http.middlewares.mcp-ratelimit.ratelimit.average=20"
      - "traefik.http.middlewares.mcp-ratelimit.ratelimit.burst=40"
      - "traefik.http.routers.taskly-mcp.middlewares=mcp-ratelimit@docker"
    ports:
      - "3066:3066"
  airflow-webserver:
    build: ./airflow
    container_name: taskly-airflow-web
    env_file:
      - ../.env
    depends_on:
      - db
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      # Datadog APM and Sentry config (enable via env file or override here)
      DD_SERVICE: taskly-airflow
      DD_TRACE_AGENT_PORT: "8126"
      DD_AGENT_HOST: ${DD_AGENT_HOST:-host.docker.internal}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      WEB_URL: http://localhost:3063
    ports:
      - "3065:8080"
    volumes:
      - airflow-data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ..:/workspace
    # Clean stale PID then start webserver
    command:
      [
        "bash",
        "-lc",
        "rm -f /opt/airflow/airflow-webserver.pid; exec airflow webserver",
      ]

  traefik:
    image: traefik:2.11
    container_name: taskly-traefik
    profiles: ["edge"]
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # redirect all http to https
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  airflow-scheduler:
    build: ./airflow
    container_name: taskly-airflow-scheduler
    env_file:
      - ../.env
    depends_on:
      - db
      - airflow-webserver
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      # Datadog APM and Sentry config (enable via env file or override here)
      DD_SERVICE: taskly-airflow
      DD_TRACE_AGENT_PORT: "8126"
      DD_AGENT_HOST: ${DD_AGENT_HOST:-host.docker.internal}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      WEB_URL: http://localhost:3063
    volumes:
      - airflow-data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ..:/workspace
    # Clean stale PID then start scheduler
    command:
      [
        "bash",
        "-lc",
        "rm -f /opt/airflow/airflow-scheduler.pid; exec airflow scheduler",
      ]
volumes:
  db-data:
  redis-data:
  airflow-data:
  traefik-letsencrypt:

networks:
  proxy:
    driver: bridge
