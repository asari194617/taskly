services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ../.env
    environment: # DB接続情報は、コンテナ内でのポートとコンテナ外のポートが異なるため、共通化せずに指定
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskly}
      MYSQL_USER: ${MYSQL_USER:-taskly}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-taskly_password}
    ports:
      - "3060:3306" # MySQL
    command:
      [
        "--sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION",
      ]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "3061:6379" # Redis
    volumes:
      - redis-data:/data
  postfix:
    build: ./docker/postfix
    container_name: taskly-postfix
    restart: unless-stopped
    ports:
      - "3062:25" # SMTP
    environment:
      - MYNETWORKS=0.0.0.0/0
      - RELAY_NETWORKS=:0.0.0.0/0
  server:
    build: ../apps/server
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    ports:
      - "3063:8080" # API
      - "3064:9464" # Metrics
    environment:
      # コンテナ間通信では localhost:3061 ではなく、サービス名:ポート を利用する
      REDIS_ADDR: redis:6379
      EMAIL_COMPOSE_GRPC_ADDR: email-compose:50051
      EMAIL_COMPOSE_HTTP_ADDR: http://email-compose:50052
  # web and mcp can be added later
  mcp:
    build: ../apps/mcp
    container_name: taskly-mcp
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment: {}
    networks:
      - default
      - proxy
    ports:
      - "3066:3066"
  airflow-webserver:
    build: ./airflow
    container_name: taskly-airflow-web
    env_file:
      - ../.env
    depends_on:
      - db
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      # Datadog APM and Sentry config (enable via env file or override here)
      DD_SERVICE: taskly-airflow
      DD_TRACE_AGENT_PORT: "8126"
      DD_AGENT_HOST: ${DD_AGENT_HOST:-host.docker.internal}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      WEB_URL: http://localhost:3063
    ports:
      - "3065:8080"
    volumes:
      - airflow-data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ..:/workspace
    # Clean stale PID, initialize/upgrade DB once, then start webserver
    command:
      [
        "bash",
        "-lc",
        "rm -f /opt/airflow/airflow-webserver.pid; (airflow db init || airflow db upgrade || true); exec airflow webserver",
      ]
  email-compose:
    build: ../apps/email-compose
    container_name: taskly-email-compose
    env_file:
      - ../.env
    depends_on:
      - redis
    restart: unless-stopped
    environment:
      EMAIL_COMPOSE_GRPC_HOST: 0.0.0.0
      EMAIL_COMPOSE_GRPC_PORT: 50051
      EMAIL_COMPOSE_HTTP_PORT: 50052
      DD_SERVICE: taskly-email-compose
      DD_TRACE_AGENT_PORT: "8126"
      DD_AGENT_HOST: ${DD_AGENT_HOST:-host.docker.internal}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    ports:
      - "3070:50051"
      - "3071:50052"
  airflow-scheduler:
    build: ./airflow
    container_name: taskly-airflow-scheduler
    env_file:
      - ../.env
    depends_on:
      - db
      - airflow-webserver
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      # Datadog APM and Sentry config (enable via env file or override here)
      DD_SERVICE: taskly-airflow
      DD_TRACE_AGENT_PORT: "8126"
      DD_AGENT_HOST: ${DD_AGENT_HOST:-host.docker.internal}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      WEB_URL: http://localhost:3063
    volumes:
      - airflow-data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ..:/workspace
    # Clean stale PID, initialize/upgrade DB once, then start scheduler
    command:
      [
        "bash",
        "-lc",
        "rm -f /opt/airflow/airflow-scheduler.pid; (airflow db init || airflow db upgrade || true); exec airflow scheduler",
      ]
volumes:
  db-data:
  redis-data:
  airflow-data:

networks:
  proxy:
    driver: bridge
