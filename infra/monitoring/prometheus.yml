global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: taskly-api
    metrics_path: /metrics
    static_configs:
      - targets: [server:9464]
  - job_name: taskly-airflow
    metrics_path: /metrics
    static_configs:
      - targets: [airflow-scheduler:9470]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: taskly-services
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://server:8080/healthz
          - http://mcp:3066/healthz
          - http://airflow-webserver:3065/api/v2/monitor/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
