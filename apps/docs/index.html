<!DOCTYPE html>
<html>
  <head>
    <title>Taskly API Document</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
      }
      #app {
        height: 100vh;

    </script>
  </body>
