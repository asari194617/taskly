openapi: 3.0.3
info:
  title: Taskly 公開 API
  version: 1.0.0
  description: API キーで利用できる公開 REST API です。すべてのリクエストに X-API-Key ヘッダーを含めてください。
servers:
  - url: https://api.taskly.iy0306.com
    description: 本番環境
  - url: https://local.api.taskly.iy0306.com
    description: ローカル HTTPS 開発環境
  - url: http://localhost:3063
    description: ローカル開発環境
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
        added_user_id:
          type: integer
          format: int64
        title:
          type: string
        subject_id:
          type: integer
          format: int64
        description:
          type: string
          nullable: true
        type:
          type: string
          enum: [ONLINE, FACE_TO_FACE, QUIZ, PRESENTATION, SELF_STUDY, OTHER]
        is_require_hand_in:
          type: boolean
        is_self_check_required:
          type: boolean
        is_completion_disabled:
          type: boolean
          description: この課題の完了操作が無効になっているかどうか。
        deadline:
          type: string
          format: date
        deadline_since:
          type: string
        deadline_until:
          type: string
    UserMe:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
        is_admin:
          type: boolean
        is_manager:
          type: boolean
paths:
  /tasks:
    get:
      summary: 課題の一覧をページ単位で取得
      parameters:
        - in: query
          name: overdue
          schema:
            type: boolean
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - in: query
          name: cursor_deadline
          schema:
            type: string
            format: date
        - in: query
          name: cursor_id
          schema:
            type: integer
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                  next_cursor:
                    type: object
                    additionalProperties:
                      type: string
    post:
      summary: 課題を作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, subject_id, deadline]
              properties:
                title: { type: string }
                subject_id: { type: integer }
                description: { type: string, nullable: true }
                type: { type: string }
                is_require_hand_in: { type: boolean }
                is_self_check_required: { type: boolean }
                is_completion_disabled:
                  type: boolean
                  description: 省略時は課題の種類ごとに設定された既定値を使います。
                deadline: { type: string, format: date }
                deadline_since: { type: string }
                deadline_until: { type: string }
      responses:
        "201":
          description: 作成しました
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{id}:
    patch:
      summary: 課題を更新
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, nullable: true }
                subject_id: { type: integer, nullable: true }
                description: { type: string, nullable: true }
                type: { type: string, nullable: true }
                is_require_hand_in: { type: boolean, nullable: true }
                is_self_check_required: { type: boolean, nullable: true }
                is_completion_disabled:
                  type: boolean
                  nullable: true
                  description: 完了操作を無効にすると、既存の完了記録を消去します。省略時は現在の設定を保持します。
                deadline: { type: string, format: date, nullable: true }
                deadline_since: { type: string, nullable: true }
                deadline_until: { type: string, nullable: true }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      summary: 課題を削除
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: レスポンス本文なし
  /users/me:
    get:
      summary: 現在のユーザーのプロフィールを取得
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMe"
    patch:
      summary: 現在のユーザーのプロフィールを更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
      responses:
        "204":
          description: レスポンス本文なし
