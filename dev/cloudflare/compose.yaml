# Use as an overlay on infra/docker-compose.yml. Paths are relative to infra/.
services:
  server:
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      R2_ENDPOINT: http://127.0.0.1:8788/cdn-cgi/local/r2/s3
      R2_BUCKET: taskly-task-images-local
      R2_ACCESS_KEY_ID: taskly-local-access-key
      R2_SECRET_ACCESS_KEY: taskly-local-secret-key
  r2:
    build:
      context: ../cloudflare-email-workers
      dockerfile: ../dev/cloudflare/Dockerfile
    # The S3 emulator only accepts loopback Host and Origin headers. Sharing
    # the API's network namespace gives the API and browser the same S3 URL.
    network_mode: service:server
    depends_on:
      server:
        condition: service_started
        restart: true
    volumes:
      - r2-data:/app/.cloudflare/state
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/cdn-cgi/local/explorer').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  r2-data:
